version: 2
updates:
  # Only the openai-api-pi-extension pin; middleware/* submodules are maintained in their own repos.
  - package-ecosystem: gitsubmodule
    directory: /
    allow:
      - dependency-name: models-enricher/vendor/openai-api-pi-extension
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /models-enricher
    # Hourly so new models reach the bundled metadata snapshots quickly.
    schedule:
      interval: cron
      cronjob: "0 * * * *"
    groups:
      # One PR moves both bundled metadata snapshots; review the models-table diff before merging.
      metadata-data:
        patterns:
          - "@opencode-ai/models"
          - modelparams
  - package-ecosystem: docker
    directories:
      - /aisix
      - /aisix-status
      - /cpa-model-sync
      - /egress-proxy
      - /models-enricher
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /cpa-model-sync
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /aisix-status
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
