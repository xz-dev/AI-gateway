version: 2
updates:
  # Only the openai-api-pi-extension pin; services/middleware/* submodules are maintained in their own repos.
  - package-ecosystem: gitsubmodule
    directory: /
    allow:
      - dependency-name: services/routing/model-catalog/vendor/openai-api-pi-extension
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /services/routing/model-catalog
    # Hourly so new models reach the bundled metadata snapshots quickly.
    schedule:
      interval: cron
      cronjob: "0 * * * *"
    groups:
      # One PR moves both bundled metadata snapshots; review the models-table diff before merging.
      metadata-data:
        patterns:
          - "@opencode-ai/models"
          - modelparams
  - package-ecosystem: docker
    directories:
      - /services/routing/aisix
      - /services/routing/aisix-status
      - /services/cpa/cpa-model-sync
      - /services/firewall/egress-proxy
      - /services/routing/model-catalog
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /services/cpa/cpa-model-sync
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /services/routing/aisix-status
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
