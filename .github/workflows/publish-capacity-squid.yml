name: publish-capacity-squid

on:
  push:
    branches: [feat/large-request-capacity-ci]
    paths:
      - .github/workflows/publish-capacity-squid.yml
      - services/firewall/egress-proxy/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: services/firewall/egress-proxy
          push: true
          tags: ghcr.io/xz-dev/ai-gateway-squid:capacity-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/xz-dev/AI-gateway
      - name: Record immutable image
        run: echo 'ghcr.io/xz-dev/ai-gateway-squid@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
