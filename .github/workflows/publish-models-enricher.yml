name: Publish models-enricher image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-models-enricher-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable image version
        id: image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$VERSION
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/$owner/ai-gateway-models-enricher" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a version tag
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" >/dev/null 2>&1; then
            echo "Version tag already exists." >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ./models-enricher
          push: true
          pull: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=models-enricher
          cache-to: type=gha,mode=max,scope=models-enricher
          provenance: mode=max
          sbom: true
