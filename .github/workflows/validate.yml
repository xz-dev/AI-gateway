name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate reusable Compose and runtime boundaries
        env:
          AI_GATEWAY_TUN_TEST_MODE: ci-privileged
        run: ./scripts/validate.sh .env.example
      - name: Validate optional official ZCode TLS override
        env:
          AI_GATEWAY_TUN_TEST_MODE: ci-privileged
        run: ./scripts/test-zcode-compose-candidate.sh
