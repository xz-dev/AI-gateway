name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check Rust model synchronization
        working-directory: cpa-model-sync
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-go@v5
        with:
          go-version-file: models-enricher/go.mod
          cache-dependency-path: models-enricher/go.sum
      - name: Check Go metadata boundary
        working-directory: models-enricher
        run: |
          go test -race ./...
          go vet ./...
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate reusable Compose and runtime boundaries
        env:
          AI_GATEWAY_TUN_TEST_MODE: ci-privileged
        run: ./scripts/validate.sh .env.example
      - name: Render generic provider-sidecar scaffold
        run: ./scripts/test-provider-sidecar-compose-candidate.sh
