name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate reusable Compose and runtime boundaries
        env:
          AI_GATEWAY_TUN_TEST_MODE: ci-privileged
        run: ./scripts/validate.sh .env.example
      - name: Validate optional official ZCode namespace override
        env:
          ZCODE_PROXY_CREDENTIAL_SECRET: test-only
          ZCODE_PROXY_API_KEY: test-only
          AI_GATEWAY_TUN_TEST_MODE: ci-privileged
        run: |
          ./scripts/init-zcode-override.sh
          ./scripts/validate.sh .env.example
