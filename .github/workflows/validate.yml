name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check Rust model synchronization
        working-directory: services/cpa/cpa-model-sync
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/routing/aisix-status/go.mod
          cache-dependency-path: services/routing/aisix-status/go.sum
      - name: Check AISIX status boundary
        working-directory: services/routing/aisix-status
        run: |
          go test -race ./...
          go vet ./...
  model-catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/routing/model-catalog
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/routing/model-catalog/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build tables and bundles
        run: npm run build
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate reusable Compose and runtime boundaries
        env:
          AI_GATEWAY_TUN_TEST_MODE: ci-privileged
        run: ./ops/scripts/validate.sh .env.example
      - name: Render generic provider-sidecar scaffold
        run: ./ops/scripts/tests/test-provider-sidecar-compose-candidate.sh
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/ansible
    env:
      COMPOSE_VERSION: 2.40.3
      COMPOSE_SHA256: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the pinned controller toolchain and collections
        run: |
          python -m pip install -r requirements.txt
          # Fixture hosts resolve python3 to this interpreter; the API modules need requests.
          python -m pip install requests
          ansible-galaxy collection install -r requirements.yml -p collections
          # Fixture hosts run modules with the system interpreter.
          sudo apt-get install -y --no-install-recommends python3-requests python3-yaml
      - name: Pin the Docker Compose plugin to the renderer version
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - name: Lint at the production profile
        run: ansible-lint
      - name: Syntax-check every playbook
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventories/example --syntax-check "$playbook"
          done
      - name: Ansible fixture and static tests
        working-directory: .
        run: |
          python3 ops/scripts/tests/docker_shim_specs.py
          python3 ops/scripts/tests/test-ansible-operations.py
          python3 ops/scripts/tests/test-ansible-preflight.py
          python3 ops/scripts/tests/test-ansible-managed-file.py
          python3 ops/scripts/tests/test-ansible-aisix-mode.py
          ops/scripts/tests/test-ansible-squid-source.sh
          ops/scripts/tests/test-ansible-model-catalog-config.sh
          ops/scripts/tests/test-ansible-model-sync.sh
          python3 ops/scripts/tests/test-component-deploy.py
          python3 ops/scripts/tests/test-component-apply.py --evidence "$RUNNER_TEMP/component-apply"
      - name: Compose module parity on the Docker Engine
        working-directory: .
        run: |
          ops/scripts/tests/test-compose-module-parity.sh
          if PARITY_MUTATION=with-deps ops/scripts/tests/test-compose-module-parity.sh; then
            echo 'negative control passed unexpectedly' >&2; exit 1
          fi
