# Example inventory — copy to inventory.local.ini (gitignored) and edit.
# The private config directory lives outside this repo.
[gateway]
rainyun-la ansible_host=100.94.238.35 ansible_user=root

[gateway:vars]
# Absolute path to the operator's local private config directory.
# Contains: compose.yaml, compose.override.yaml, .env, aisix/resources.yaml,
# data/egress-proxy/policy.json (all adopted from production at baseline).
ai_ops_config_dir=/path/to/private/ai-gateway-config
# Remote deployment root (verified, e.g. /root/AI-gateway on rainyun-la).
ai_ops_deploy_root=/root/AI-gateway
ai_ops_compose_project=ai-gateway
