# Squid policy deploy: render locally, validate with pinned Squid, upload + activate.
# Usage: ansible-playbook playbooks/deploy-squid.yml [-e ai_ops_mode=plan]

- name: Squid policy deploy
  hosts: gateway
  gather_facts: false
  vars:
    ai_ops_mode: apply
    _policy_local: "{{ ai_ops_config_dir }}/data/egress-proxy/policy.json"
    _staging: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/ai-gateway-ops/squid-staging"
    _squid_image: "{{ squid_image | default('ai-gateway-squid:6.13-2-deb13u2') }}"
  pre_tasks:
    - name: Preflight
      ansible.builtin.include_tasks: ../tasks/preflight.yml

    - name: Render policy locally into staging
      ansible.builtin.command: >
        python3 {{ playbook_dir }}/../../scripts/render-egress-policy.py
        {{ _policy_local }} {{ _staging }}
      delegate_to: localhost

    - name: Generate throwaway CA for offline parse validation
      ansible.builtin.shell: >
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ops-validation
        -addext basicConstraints=critical,CA:TRUE
        -addext keyUsage=critical,keyCertSign,cRLSign
        -keyout {{ _staging }}/ca.key -out {{ _staging }}/ca.crt 2>/dev/null
        && chmod 644 {{ _staging }}/ca.key {{ _staging }}/ca.crt
      delegate_to: localhost
      changed_when: false

    - name: Validate rendered config with pinned Squid (k parse)
      ansible.builtin.command: >
        podman run --rm --entrypoint /usr/sbin/squid
        -v {{ _staging }}:/etc/squid/generated:ro
        -v {{ _staging }}/ca.crt:/etc/squid/ca.crt:ro
        -v {{ _staging }}/ca.key:/etc/squid/ca.key:ro
        {{ _squid_image }} -k parse -f /etc/squid/generated/squid.conf
      delegate_to: localhost
      register: _squid_parse
      changed_when: false

    - name: Show parse result
      ansible.builtin.debug:
        var: _squid_parse.stderr_lines | default([]) + _squid_parse.stdout_lines

  tasks:
    - name: Deploy rendered squid.conf
      ansible.builtin.include_tasks: ../tasks/deploy-file.yml
      vars:
        ai_file_label: squid-generated/squid.conf
        ai_file_local: "{{ _staging }}/squid.conf"
        ai_file_remote: "{{ ai_ops_deploy_root }}/data/egress-proxy/generated/squid.conf"
        ai_activate_cmd: >-
          {{ ai_ops_compose_cmd }} -p {{ ai_ops_compose_project }}
          -f {{ ai_ops_deploy_root }}/compose.yaml
          -f {{ ai_ops_deploy_root }}/compose.override.yaml
          --env-file {{ ai_ops_deploy_root }}/.env
          restart egress-proxy

    - name: Deploy policy- files (blocked cidrs + per-service ACL files)
      ansible.builtin.include_tasks: ../tasks/deploy-file.yml
      loop: "{{ query('ansible.builtin.fileglob', _staging + '/policy-*') }}"
      loop_control:
        loop_var: _policy_file
      vars:
        ai_file_label: "squid-generated/{{ _policy_file | basename }}"
        ai_file_local: "{{ _policy_file }}"
        ai_file_remote: "{{ ai_ops_deploy_root }}/data/egress-proxy/generated/{{ _policy_file | basename }}"
