---
# Drift gate + upload + activate for one deploy-managed file.
# Params (vars): ai_file_local, ai_file_remote, ai_file_label,
#                ai_activate_cmd (optional shell command run after upload when changed),
#                ai_verify_tasks (optional role task file run before baseline update),
#                ai_verify_expected_* / ai_recovery_expected_* (task inputs),
#                ai_failure_receipt_path/content (optional rescue receipt),
#                ai_file_mode (optional explicit upload mode; "preserve" by default).
# Mode comes from role default ai_ops_mode (plan|apply).

- name: "Prepare {{ ai_file_label }}"
  ansible.builtin.include_tasks: prepare-file.yml

- name: "Adopt matching remote into baseline (remote == local, baseline stale or missing)"
  ansible.builtin.copy:
    src: "{{ ai_file_local }}"
    dest: "{{ _ai_baseline }}"
    mode: "0600"
  when:
    - ai_ops_mode != "plan"
    - _ai_remote_stat.stat.exists
    - _ai_local_stat.stat.checksum == _ai_remote_stat.stat.checksum
    - not _ai_baseline_stat.stat.exists or _ai_baseline_stat.stat.checksum != _ai_local_stat.stat.checksum

# Apply-only section below. Plan mode skips the rest of this file for THIS file
# (end_role would end the whole role; when-gating keeps later files' diffs visible).

- name: "Ensure remote parent dir for {{ ai_file_label }}"
  ansible.builtin.file:
    path: "{{ ai_file_remote | dirname }}"
    state: directory
    mode: "0755"
  when: ai_ops_mode != "plan"

- name: "Save pre-deploy copy of {{ ai_file_label }}"
  ansible.builtin.copy:
    src: "{{ ai_file_remote }}"
    dest: "{{ _ai_predeploy }}"
    remote_src: true
    mode: preserve
  when:
    - ai_ops_mode != "plan"
    - _ai_remote_stat.stat.exists

- name: "Upload {{ ai_file_label }}"
  ansible.builtin.copy:
    src: "{{ ai_file_local }}"
    dest: "{{ ai_file_remote }}"
    mode: "{{ ai_file_mode | default('preserve') }}"
  register: _ai_upload
  when:
    - ai_ops_mode != "plan"
    - _ai_remote_stat.stat.checksum | default('') != _ai_local_stat.stat.checksum

- name: "Activate {{ ai_file_label }}"
  block:
    - name: "Run activation command for {{ ai_file_label }}"
      ansible.builtin.command: "{{ ai_activate_cmd }}"
    - name: "Verify activated {{ ai_file_label }}"
      ansible.builtin.include_tasks: "{{ ai_verify_tasks }}"
      vars:
        _ai_verify_expected_policy_digest: "{{ ai_verify_expected_policy_digest }}"
        _ai_verify_expected_state_digest: "{{ ai_verify_expected_state_digest }}"
        _ai_verify_expected_image_identity: "{{ ai_verify_expected_image_identity }}"
      when: ai_verify_tasks is defined
  rescue:
    - name: "Activation failed: restore pre-deploy copy of {{ ai_file_label }}"
      ansible.builtin.copy:
        src: "{{ _ai_predeploy }}"
        dest: "{{ ai_file_remote }}"
        remote_src: true
        mode: "{{ ai_file_mode | default('preserve') }}"
      when: _ai_remote_stat.stat.exists
    - name: "Reactivate restored {{ ai_file_label }}"
      ansible.builtin.command: "{{ ai_activate_cmd }}"
      failed_when: false
      register: _ai_recovery
    - name: "Verify restored {{ ai_file_label }}"
      block:
        - ansible.builtin.include_tasks: "{{ ai_verify_tasks }}"
          vars:
            _ai_verify_expected_policy_digest: "{{ ai_recovery_expected_policy_digest }}"
            _ai_verify_expected_state_digest: "{{ ai_recovery_expected_state_digest }}"
            _ai_verify_expected_image_identity: "{{ ai_recovery_expected_image_identity }}"
      rescue:
        - ansible.builtin.set_fact:
            _ai_recovery_verify_failed: true
      when: ai_verify_tasks is defined
    - name: "Record failed activation/recovery receipt"
      ansible.builtin.copy:
        dest: "{{ ai_failure_receipt_path }}"
        mode: "0600"
        content: "{{ ai_failure_receipt_content }}"
      when: ai_failure_receipt_path is defined and ai_failure_receipt_content is defined
    - name: "Report recovery outcome and fail"
      ansible.builtin.fail:
        msg: >-
          Activation/verification of {{ ai_file_label }} failed; pre-deploy copy restored,
          reactivation rc={{ _ai_recovery.rc | default('n/a') }},
          recovery verification={{ 'failed' if _ai_recovery_verify_failed | default(false) else 'passed' }}.
          Investigate before retrying.
  when:
    - ai_ops_mode != "plan"
    - ai_activate_cmd is defined
    - _ai_upload is changed

- name: "Record new baseline for {{ ai_file_label }}"
  ansible.builtin.copy:
    src: "{{ ai_file_local }}"
    dest: "{{ _ai_baseline }}"
    mode: "0600"
  when:
    - ai_ops_mode != "plan"
    - _ai_upload is changed
