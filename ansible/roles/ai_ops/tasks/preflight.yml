---
# Shared preflight: compose provider detection, connectivity, deploy root, state dir.
# Variables come from this role's defaults/main.yml; override in inventory.

- name: Detect Compose provider (mirrors scripts/container-runtime.sh)
  ansible.builtin.shell: |
    runtime="{{ ai_ops_runtime }}"
    if [ -z "$runtime" ]; then
      if command -v docker >/dev/null && docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then runtime=docker;
      elif command -v podman >/dev/null && podman info >/dev/null 2>&1; then runtime=podman;
      else echo 'no usable container runtime' >&2; exit 1; fi
    fi
    if [ "$runtime" = docker ]; then echo "docker compose";
    elif podman compose version >/dev/null 2>&1; then echo "podman compose";
    elif command -v podman-compose >/dev/null 2>&1; then echo "podman-compose";
    else echo 'no compose provider' >&2; exit 1; fi
  register: _ai_ops_compose
  changed_when: false
  when: ai_ops_compose_cmd == ""

- name: Set compose command (inventory override wins)
  ansible.builtin.set_fact:
    ai_ops_compose_cmd: "{{ ai_ops_compose_cmd if ai_ops_compose_cmd != '' else _ai_ops_compose.stdout }}"

- name: Show detected compose provider
  ansible.builtin.debug:
    msg: "compose provider: {{ ai_ops_compose_cmd }}"

- name: Verify SSH connectivity (no fallback auth)
  ansible.builtin.ping:

- name: Verify deploy root exists
  ansible.builtin.stat:
    path: "{{ ai_ops_deploy_root }}"
  register: _ai_ops_root
  failed_when: not (_ai_ops_root.stat.exists and _ai_ops_root.stat.isdir)

- name: Verify local config dir exists
  ansible.builtin.stat:
    path: "{{ ai_ops_config_dir }}"
  delegate_to: localhost
  register: _ai_ops_cfg
  failed_when: not (_ai_ops_cfg.stat.exists and _ai_ops_cfg.stat.isdir)

- name: Ensure protected state dir (apply only)
  ansible.builtin.file:
    path: "{{ ai_ops_deploy_root }}/.ai-ops-state"
    state: directory
    mode: "0700"
  when: ai_ops_mode != "plan"

- name: Gather runtime versions
  ansible.builtin.shell: "{{ ai_ops_runtime if ai_ops_runtime != '' else 'docker' }} version --format '{{ '{{' }} .Server.Version {{ '}}' }}'"
  register: ai_ops_runtime_version
  changed_when: false
  failed_when: false
