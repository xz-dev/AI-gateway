# Drift gate + upload + activate for one deploy-managed file.
# Params (vars): ai_file_local, ai_file_remote, ai_file_label, ai_ops_mode (plan|apply),
#                ai_activate_cmd (optional shell command run after upload when changed).

- name: "Baseline copy path"
  ansible.builtin.set_fact:
    _ai_baseline: "{{ ai_ops_deploy_root }}/.ai-ops-state/{{ ai_file_label | replace('/', '__') }}.baseline"
    _ai_predeploy: "{{ ai_ops_deploy_root }}/.ai-ops-state/{{ ai_file_label | replace('/', '__') }}.predeploy"

- name: "Read remote current checksum of {{ ai_file_label }}"
  ansible.builtin.stat:
    path: "{{ ai_file_remote }}"
    checksum_algorithm: sha256
  register: _ai_remote_stat

- name: "Read baseline checksum of {{ ai_file_label }}"
  ansible.builtin.stat:
    path: "{{ _ai_baseline }}"
    checksum_algorithm: sha256
  register: _ai_baseline_stat

- name: "Read local file checksum"
  ansible.builtin.stat:
    path: "{{ ai_file_local }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  register: _ai_local_stat

- name: "Drift gate for {{ ai_file_label }}"
  ansible.builtin.fail:
    msg: >-
      Remote {{ ai_file_label }} changed since last deploy
      (remote={{ _ai_remote_stat.stat.checksum }} baseline={{ _ai_baseline_stat.stat.checksum }}).
      Show the diff, adopt changes into the local file, or reconcile manually. Nothing was uploaded.
  when:
    - _ai_remote_stat.stat.exists
    - _ai_baseline_stat.stat.exists
    - _ai_remote_stat.stat.checksum != _ai_baseline_stat.stat.checksum
    # remote matches local file = operator already adopted it; refresh baseline below
    - _ai_remote_stat.stat.checksum != _ai_local_stat.stat.checksum

- name: "Fetch remote copy for diff when content differs"
  ansible.builtin.slurp:
    src: "{{ ai_file_remote }}"
  register: _ai_remote_slurp
  no_log: true
  when:
    - _ai_remote_stat.stat.exists
    - _ai_remote_stat.stat.checksum != _ai_local_stat.stat.checksum

- name: "Show effective diff (local vs remote)"
  ansible.builtin.shell: >
    printf '%s' '{{ (_ai_remote_slurp.content | default('') | b64decode) if _ai_remote_stat.stat.exists else '' }}'
    > /tmp/ai-ops-diff-remote.$$ &&
    diff -u /tmp/ai-ops-diff-remote.$$ {{ ai_file_local }};
    rc=$?; rm -f /tmp/ai-ops-diff-remote.$$; exit $rc
  delegate_to: localhost
  register: ai_file_diff
  changed_when: false
  failed_when: ai_file_diff.rc > 1
  check_mode: false
  no_log: "{{ ai_file_label == '.env' }}"
  when:
    - _ai_remote_stat.stat.checksum | default('') != _ai_local_stat.stat.checksum

- name: "Diff output"
  ansible.builtin.debug:
    var: ai_file_diff.stdout_lines
  when:
    - ai_file_diff is defined
    - ai_file_diff.rc is defined
    - ai_file_diff.rc == 1

- name: "No effective change for {{ ai_file_label }}"
  ansible.builtin.debug:
    msg: "{{ ai_file_label }}: no effective change"
  when:
    - _ai_remote_stat.stat.exists
    - _ai_remote_stat.stat.checksum == _ai_local_stat.stat.checksum
    - _ai_baseline_stat.stat.exists
    - _ai_local_stat.stat.checksum == _ai_baseline_stat.stat.checksum

- name: "Adopt matching remote into baseline (remote == local, baseline stale or missing)"
  ansible.builtin.copy:
    src: "{{ ai_file_local }}"
    dest: "{{ _ai_baseline }}"
    mode: "0600"
  when:
    - not ai_ops_mode_plan
    - _ai_local_stat.stat.checksum == _ai_remote_stat.stat.checksum
    - not _ai_baseline_stat.stat.exists or _ai_baseline_stat.stat.checksum != _ai_local_stat.stat.checksum

- name: "Stop here in plan mode"
  ansible.builtin.meta: end_play
  when: ai_ops_mode_plan

- name: "Ensure remote parent dir for {{ ai_file_label }}"
  ansible.builtin.file:
    path: "{{ ai_file_remote | dirname }}"
    state: directory
    mode: "0755"

- name: "Save pre-deploy copy of {{ ai_file_label }}"
  ansible.builtin.copy:
    src: "{{ ai_file_remote }}"
    dest: "{{ _ai_predeploy }}"
    remote_src: true
    mode: preserve
  when: _ai_remote_stat.stat.exists

- name: "Upload {{ ai_file_label }}"
  ansible.builtin.copy:
    src: "{{ ai_file_local }}"
    dest: "{{ ai_file_remote }}"
    mode: preserve
  register: _ai_upload
  when: _ai_remote_stat.stat.checksum | default('') != _ai_local_stat.stat.checksum

- name: "Activate {{ ai_file_label }}"
  block:
    - ansible.builtin.command: "{{ ai_activate_cmd }}"
  rescue:
    - name: "Activation failed: restore pre-deploy copy of {{ ai_file_label }}"
      ansible.builtin.copy:
        src: "{{ _ai_predeploy }}"
        dest: "{{ ai_file_remote }}"
        remote_src: true
        mode: preserve
      when: _ai_remote_stat.stat.exists
    - name: "Reactivate restored {{ ai_file_label }}"
      ansible.builtin.command: "{{ ai_activate_cmd }}"
      failed_when: false
      register: _ai_recovery
    - name: "Report recovery outcome and fail"
      ansible.builtin.fail:
        msg: >-
          Activation of {{ ai_file_label }} failed; pre-deploy copy restored and
          reactivation rc={{ _ai_recovery.rc | default('n/a') }}. Investigate before retrying.
  when:
    - ai_activate_cmd is defined
    - _ai_upload is changed

- name: "Record new baseline for {{ ai_file_label }}"
  ansible.builtin.copy:
    src: "{{ ai_file_local }}"
    dest: "{{ _ai_baseline }}"
    mode: "0600"
  when: _ai_upload is changed
