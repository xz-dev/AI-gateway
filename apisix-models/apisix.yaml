        max_retries: 1
        instances:
          - name: axis
            provider: openai-compatible
            auth:
              header:
                Authorization: "Bearer __CPA_API_KEY__"
            priority: 1
            weight: 1
            override:
              endpoint: "http://172.30.35.3:8317"
            options:
              model: "axis/gpt-5.6-terra"
    upstream_id: cpa
  - id: alias-gpt-5-6-luna
    uris:
      - /v1/chat/completions
      - /v1/responses
    methods:
      - POST
    priority: 30
    filter_func: |
