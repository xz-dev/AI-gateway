upstreams:
  - id: enricher
    type: roundrobin
    nodes:
      "models-enricher:8090": 1
    timeout:
      connect: 5
      send: 30
      read: 30
  - id: wsalias
    type: roundrobin
    nodes:
      "ws-alias-proxy:8090": 1
    timeout:
      connect: 5
      send: 3600
      read: 3600
  - id: aisix
    type: roundrobin
    nodes:
      "aisix:3000": 1
    timeout:
      connect: 3600
      send: 3600
      read: 3600
  - id: cpa
    type: roundrobin
    nodes:
      "cpa:8317": 1
    timeout:
      connect: 3600
      send: 3600
      read: 3600

routes:
  # 仅模型承载的HTTP推理入口做目录选路；优先级高于所有历史别名规则。
  # 原始model不改写；WS GET升级保持下方独立路径。
  - id: catalog-routing-selector
    uris:
      - /v1/chat/completions
      - /v1/responses
    methods:
      - POST
    priority: 100
    plugins:
      proxy-buffering:
        disable_proxy_buffering: true
      serverless-pre-function:
        phase: rewrite
        functions:
          - >-
            return function(_, ctx)
              local status, body, headers = require("routing_selector").run(_, ctx, "__CPA_API_KEY__")
              if status then
                return status, body, headers
              end
            end
    upstream_id: cpa
  # WS 别名覆盖：GET /v1/responses + Upgrade → ws-alias-proxy 边车（帧级 model 改写）
  - id: ws-alias
    uris:
      - /v1/responses
    methods:
      - GET
    priority: 30
    vars:
      - ["http_upgrade", "==", "websocket"]
    enable_websocket: true
    upstream_id: wsalias
  # HTML只接收目录边车的真实连接来源，不信任转发头中的地址。
  - id: models-table
    uri: /models-table
    methods: [GET]
    priority: 20
    vars:
      - ["realip_remote_addr", "==", "172.30.42.3"]
    upstream_id: enricher
  # 标准OpenAI与Codex目录都交给enricher；最终富目录不缓存。
  - id: codex-models
    uri: /v1/models
    methods:
      - GET
    priority: 20
    upstream_id: enricher
  - id: catch-all
    uri: /*
    priority: 1
    enable_websocket: true
    plugins:
      proxy-buffering:
        disable_proxy_buffering: true
      # 2026-09-10: Kimi 上游不支持 prompt_cache_retention（400 invalid_request_error），
      # CPA kimi_executor 不剥字段，导致 400→500 转换后 sub2api 重试 10 次、
      # 客户端表现为长时间 hang + 最终 Connection error。
      # 在此统一剥除该字段，避免无效上游调用和重试风暴。
      # 注意：WS 路径不经过此插件（APISIX WS 代理跳过 body 插件），
      #       WS 侧由 ws-alias-proxy 的 rewriteBody 同步剥除。
      serverless-pre-function:
        phase: rewrite
        functions:
          - >-
            return function()
              local ct = ngx.var.http_content_type or ""
              if not ct:find("json") then return end
              ngx.req.read_body()
              local body = ngx.req.get_body_data()
              if not body or body == "" then return end
              local dkjson = require("dkjson")
              local obj, pos, err = dkjson.decode(body, 1, nil)
              if err or type(obj) ~= "table" then return end
              if obj.prompt_cache_retention == nil then return end
              obj.prompt_cache_retention = nil
              local nb = dkjson.encode(obj)
              if nb then ngx.req.set_body_data(nb) end
            end
    upstream_id: cpa
#END
