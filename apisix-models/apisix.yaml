          hash_on: header
          key: session_id
        fallback_strategy:
          - http_429
          - http_5xx
        max_retries: 1
        instances:
          - name: grok-oauth
            provider: openai-compatible
            auth:
              header:
                Authorization: "Bearer __CPA_API_KEY__"
            priority: 1
            weight: 1
            override:
              endpoint: "http://172.30.35.3:8317"
