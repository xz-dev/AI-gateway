        max_retries: 1
        instances:
          - name: axis
            provider: openai-compatible
            auth:
              header:
                Authorization: "Bearer __CPA_API_KEY__"
            priority: 1
            weight: 1
            override:
              endpoint: "http://172.30.35.3:8317"
            options:
