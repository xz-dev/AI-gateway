  - id: alias-team-a-gpt-5-6-sol
    uris:
      - /v1/chat/completions
      - /v1/responses
    methods:
      - POST
    priority: 30
    filter_func: |
      function(vars)
        ngx.req.read_body()
        local b = ngx.req.get_body_data() or ""
        return b:find('"model"%s*:%s*"team%-a/gpt%-5%.6%-sol"') ~= nil
