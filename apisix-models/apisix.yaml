  - id: alias-team-a-gpt-5-6-sol
    uris:
      - /v1/chat/completions
      - /v1/responses
    methods:
      - POST
    priority: 30
    filter_func: |
      function(vars)
        ngx.req.read_body()
        local b = ngx.req.get_body_data() or ""
        return b:find('"model"%s*:%s*"team%-a/gpt%-5%.6%-sol"') ~= nil
      end
    plugins:
      ai-proxy-multi:
        balancer:
          algorithm: chash
          hash_on: header
          key: session_id
        fallback_strategy:
          - http_429
          - http_5xx
        max_retries: 1
        instances:
          - name: axis
            provider: openai-compatible
            auth:
              header:
                Authorization: "Bearer __CPA_API_KEY__"
            priority: 1
            weight: 1
            override:
              endpoint: "http://172.30.35.3:8317"
            options:
              model: "axis/gpt-5.6-sol"
    upstream_id: cpa
  # WS 别名覆盖：GET /v1/responses + Upgrade → ws-alias-proxy 边车（帧级 model 改写）
  - id: ws-alias
    uris:
      - /v1/responses
    methods:
      - GET
    priority: 30
    vars:
      - ["http_upgrade", "==", "websocket"]
    enable_websocket: true
    upstream_id: wsalias
  # HTML只接收目录边车的真实连接来源，不信任转发头中的地址。
  - id: models-table
    uri: /models-table
    methods: [GET]
    priority: 20
    vars:
      - ["realip_remote_addr", "==", "172.30.42.3"]
    upstream_id: enricher
  # 仅带非空client_version的目录请求交给enricher；最终富目录不缓存。
  # 其余请求沿catch-all直接送CPA。
  - id: codex-models
    uri: /v1/models
    methods:
      - GET
    priority: 20
    vars:
      - ["arg_client_version", "~~", ".+"]
    upstream_id: enricher
  - id: catch-all
    uri: /*
    priority: 1
    enable_websocket: true
    plugins:
      proxy-buffering:
        disable_proxy_buffering: true
      # 2026-09-10: Kimi 上游不支持 prompt_cache_retention（400 invalid_request_error），
      # CPA kimi_executor 不剥字段，导致 400→500 转换后 sub2api 重试 10 次、
      # 客户端表现为长时间 hang + 最终 Connection error。
      # 在此统一剥除该字段，避免无效上游调用和重试风暴。
      # 注意：WS 路径不经过此插件（APISIX WS 代理跳过 body 插件），
      #       WS 侧由 ws-alias-proxy 的 rewriteBody 同步剥除。
      serverless-pre-function:
        phase: rewrite
        functions:
          - >-
            return function()
              local ct = ngx.var.http_content_type or ""
              if not ct:find("json") then return end
              ngx.req.read_body()
              local body = ngx.req.get_body_data()
              if not body or body == "" then return end
              local dkjson = require("dkjson")
              local obj, pos, err = dkjson.decode(body, 1, nil)
              if err or type(obj) ~= "table" then return end
              if obj.prompt_cache_retention == nil then return end
              obj.prompt_cache_retention = nil
              local nb = dkjson.encode(obj)
              if nb then ngx.req.set_body_data(nb) end
            end
    upstream_id: cpa
#END
