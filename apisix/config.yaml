apisix:
  node_listen:
    - 9080
  enable_admin: false
  enable_control: false
  enable_ipv6: false
  extra_lua_path: "/opt/apisix/custom/?.lua"
  dns_resolver:
    - 127.0.0.11

nginx_config:
  worker_processes: 1
  error_log_level: warn
  http_server_configuration_snippet: |
    error_page 413 = @payload_too_large;
    location @payload_too_large {
      default_type application/json;
      more_clear_headers Server;
      return 413 '{"error":{"message":"Payload too large","type":"invalid_request_error"}}';
    }
  http:
    client_max_body_size: 16m
    custom_lua_shared_dict:
      model-list-intersection: 1m

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
