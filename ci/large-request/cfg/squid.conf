# Plain HTTP forward proxy before the mock, not TLS bump (approved CI difference).
# Squid's default request_body_max_size is unlimited; production image, mock-only egress.
http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
acl mock_host dstdomain mock
acl mock_port port 18080
http_access allow mock_host mock_port
http_access deny all
cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
