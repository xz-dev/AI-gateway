name: ai-gateway

# Omitted memswap_limit allows additional swap up to mem_limit (Docker default).
# Keep explicit combined RAM+swap budgets only where a different allowance is needed.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-netns-owner: &netns-owner
  image: ${NETNS_GUARD_IMAGE:-docker.io/library/alpine:3.24.2}
  restart: unless-stopped
  pids_limit: 16
  mem_limit: 16m
  cpus: 0.1
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETGID, SETUID]
  logging: *default-logging
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=1m"]
  command:
    - /bin/sh
    - -ec
    - >-
      while ip -4 route show default | grep -q .; do ip -4 route del default; done;
      while ip -6 route show default | grep -q .; do ip -6 route del default; done;
      test -z "$$(ip -4 route show default)";
      test -z "$$(ip -6 route show default)";
      exec su nobody -s /bin/sh -c 'exec sleep infinity'

x-socat-relay: &socat-relay
  image: ${SOCAT_IMAGE:-docker.io/alpine/socat:1.8.1.3}
  user: "65534:65534"
  restart: unless-stopped
  pids_limit: 512
  mem_limit: 64m
  cpus: 0.2
  read_only: true
  cap_drop: [ALL]
  logging: *default-logging
  security_opt: [no-new-privileges:true]

services:
  egress-proxy:
    build:
      context: ./services/firewall/egress-proxy
    image: ${EGRESS_PROXY_IMAGE:-ai-gateway-squid:6.13-2-deb13u3-r1}
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 192m
    memswap_limit: 256m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/lib/squid/ssl_db:rw,noexec,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./data/egress-proxy/generated:/etc/squid/generated:ro,Z
      - ./data/egress-proxy/ca.crt:/etc/squid/ca.crt:ro,z
      - ./data/egress-proxy/ca.key:/etc/squid/ca.key:ro,Z
    networks:
      cpa-squid-target:
        ipv4_address: 172.30.18.2
      sub2api-squid-target:
        ipv4_address: 172.30.20.2
      proxy-egress:
        gw_priority: 1
    healthcheck:
      test: [CMD-SHELL, "/usr/sbin/unbound-control -c /etc/unbound/ai-gateway.conf status && /usr/sbin/squid -k check -f /etc/squid/generated/squid.conf"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  cpa-host-netns:
    <<: *netns-owner
    ports:
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:${CPA_PORT:-8317}:8317"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:8085:8085"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:1455:1455"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:54545:54545"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:51121:51121"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:11451:11451"
    networks:
      cpa-host-source:
        ipv4_address: 172.30.1.2
      host-cpa-target:
        ipv4_address: 172.30.2.3

  cpa-host-relay:
    <<: *socat-relay
    network_mode: service:cpa-host-netns
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        pids=
        for port in 8317 8085 1455 54545 51121 11451; do
          socat "TCP4-LISTEN:$${port},bind=172.30.1.2,reuseaddr,fork" "TCP4:172.30.2.2:$${port},connect-timeout=10" &
          pids="$${pids} $$!"
        done
        trap 'kill $${pids} 2>/dev/null; wait $${pids} 2>/dev/null' EXIT INT TERM
        wait -n
    depends_on:
      cpa-host-netns:
        condition: service_started
        restart: true

  cpa-netns:
    <<: *netns-owner
    extra_hosts:
      - "cpa-egress-relay:172.30.17.3"
    networks:
      host-cpa-target:
        aliases: [cli-proxy-api]
        ipv4_address: 172.30.2.2
      cpa-squid-source:
        ipv4_address: 172.30.17.2
      apisix-models-cpa-target:
        ipv4_address: 172.30.36.2
      catalog-cpa-target:
        ipv4_address: 172.30.30.2
      model-sync-cpa:
        ipv4_address: 172.30.44.2
      aisix-cpa-target:
        ipv4_address: 172.30.63.2

  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/xz-dev/cli-proxy-api:v8.0.22-pr6189-c718f4d@sha256:e02efefde0e7272d0f2655b29ee4ae2316badf66d08de1ef9b50e2223eb2caf5}
    network_mode: service:cpa-netns
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        while awk 'NR > 1 && $$2 == "00000000" && $$8 == "00000000" {found=1} END {exit(found ? 0 : 1)}' /proc/net/route ||
        awk '$$1 == "00000000000000000000000000000000" && $$2 == "00" && $$10 != "lo" {found=1} END {exit(found ? 0 : 1)}' /proc/net/ipv6_route;
        do sleep 0.05; done;
        exec ./CLIProxyAPI -config /CLIProxyAPI/conf/config.yaml
    restart: unless-stopped
    depends_on:
      cpa-netns: {condition: service_started, restart: true}
      cpa-host-relay: {condition: service_started}
      cpa-squid-relay: {condition: service_started, restart: true}
    pids_limit: 256
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 1.75
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    environment:
      GOMEMLIMIT: 700MiB
      DEPLOY: docker-compose
      HTTP_PROXY: http://cpa-egress-relay:3128
      HTTPS_PROXY: http://cpa-egress-relay:3128
      NO_PROXY: 127.0.0.1,localhost,cli-proxy-api,cpa-egress-relay
      SSL_CERT_FILE: /etc/ssl/certs/ai-gateway-ca-bundle.pem
    volumes:
      - ./data/cpa/conf:/CLIProxyAPI/conf:Z
      - ./data/cpa/auths:/root/.cli-proxy-api:Z
      - ./data/cpa/logs:/CLIProxyAPI/logs:Z
      # ro: blocks in-process plugin hot reload (two SQLite copies in one process corrupted quota db)
      - ./data/cpa/plugins:/CLIProxyAPI/plugins:ro,Z
      - ./data/cpa/runtime:/CLIProxyAPI/data:Z
      - ./data/cpa/mgmt.key:/CLIProxyAPI/mgmt.key:ro,Z
      - ./data/egress-proxy/ca-bundle.pem:/etc/ssl/certs/ai-gateway-ca-bundle.pem:ro,z
    healthcheck:
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8317; printf 'HEAD /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r line <&3; [[ \"$$line\" == *\" 200 \"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cpa-squid-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3128,bind=172.30.17.3,reuseaddr,fork", "TCP4:172.30.18.2:3128,connect-timeout=10"]
    depends_on:
      egress-proxy: {condition: service_started}
    networks:
      cpa-squid-source:
        aliases: [cpa-egress-relay]
        ipv4_address: 172.30.17.3
      cpa-squid-target:
        ipv4_address: 172.30.18.3

  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:18.6-alpine3.24}
    command: [postgres, -c, max_connections=50, -c, shared_buffers=64MB]
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 400m
    cpus: 1.0
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,size=16m,mode=3777
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-UTC}
    volumes: [./data/sub2api/postgres:/var/lib/postgresql:Z]
    networks:
      sub2api-postgres-target:
        ipv4_address: 172.30.14.2
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:8.10.2-alpine3.23}
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 80m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    command:
      - /bin/sh
      - -ec
      - |
        set -- redis-server --save 60 1 --appendonly yes --appendfsync everysec
        if [ -n "$${REDIS_PASSWORD:-}" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes: [./data/sub2api/redis:/data:Z]
    networks:
      sub2api-redis-target:
        ipv4_address: 172.30.16.2
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  sub2api-host-netns:
    <<: *netns-owner
    ports:
      - "${SUB2API_BIND_ADDRESS:-127.0.0.1}:${SUB2API_PORT:-8086}:8080"
    networks:
      sub2api-host-source:
        ipv4_address: 172.30.3.2
      host-sub2api-target:
        ipv4_address: 172.30.4.3

  sub2api-host-relay:
    <<: *socat-relay
    network_mode: service:sub2api-host-netns
    command: ["TCP4-LISTEN:8080,bind=172.30.3.2,reuseaddr,fork", "TCP4:172.30.4.2:8080,connect-timeout=10"]
    depends_on:
      sub2api-host-netns: {condition: service_started, restart: true}

  sub2api-netns:
    <<: *netns-owner
    extra_hosts:
      - "aisix:172.30.60.3"
      - "cli-proxy-api:172.30.11.3"
      - "postgres:172.30.13.3"
      - "redis:172.30.15.3"
      - "sub2api-egress-relay:172.30.19.3"
    networks:
      host-sub2api-target:
        ipv4_address: 172.30.4.2
      ai-sse-sub2api-target:
        aliases: [sub2api]
        ipv4_address: 172.30.26.2
      sub2api-cpa-source:
        ipv4_address: 172.30.11.2
      sub2api-postgres-source:
        ipv4_address: 172.30.13.2
      sub2api-redis-source:
        ipv4_address: 172.30.15.2
      sub2api-squid-source:
        ipv4_address: 172.30.19.2
      sub2api-aisix-source:
        ipv4_address: 172.30.60.2

  sub2api:
    image: ${SUB2API_IMAGE:-ghcr.io/xz-dev/sub2api:0.2.16-pr7157-pr7217-pr3172-pr8191-ab6b00e@sha256:77f4715f0aa7f66dc1364b162ec4ffd6eab7874b0916d5be4e7a4c6b7b389950}
    network_mode: service:sub2api-netns
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        while awk 'NR > 1 && $$2 == "00000000" && $$8 == "00000000" {found=1} END {exit(found ? 0 : 1)}' /proc/net/route ||
        awk '$$1 == "00000000000000000000000000000000" && $$2 == "00" && $$10 != "lo" {found=1} END {exit(found ? 0 : 1)}' /proc/net/ipv6_route;
        do sleep 0.05; done;
        exec /app/docker-entrypoint.sh /app/sub2api
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 320m
    cpus: 1.5
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    depends_on:
      sub2api-netns: {condition: service_started, restart: true}
      sub2api-host-relay: {condition: service_started}
      aisix: {condition: service_started, restart: true}
      sub2api-aisix-relay: {condition: service_started, restart: true}
      sub2api-cpa-relay: {condition: service_started, restart: true}
      sub2api-postgres-relay: {condition: service_started, restart: true}
      sub2api-redis-relay: {condition: service_started, restart: true}
      sub2api-squid-relay: {condition: service_started, restart: true}
    volumes:
      - ./data/sub2api/app:/app/data:Z
      - ./data/egress-proxy/ca-bundle.pem:/etc/ssl/certs/ai-gateway-ca-bundle.pem:ro,z
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      GOMEMLIMIT: 288MiB
      RUN_MODE: ${SUB2API_RUN_MODE:-standard}
      SERVER_TRUSTED_PROXIES: ${SUB2API_TRUSTED_PROXIES:-172.30.26.3/32}
      SECURITY_TRUST_FORWARDED_IP_FOR_API_KEY_ACL: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECURITY_URL_ALLOWLIST_ENABLED: "false"
      GATEWAY_MODELS_LIST_READ_MAX_BYTES: ${GATEWAY_MODELS_LIST_READ_MAX_BYTES:-67108864}
      GATEWAY_LOG_UPSTREAM_ERROR_BODY: ${GATEWAY_LOG_UPSTREAM_ERROR_BODY:-true}
      GATEWAY_LOG_UPSTREAM_ERROR_BODY_MAX_BYTES: ${GATEWAY_LOG_UPSTREAM_ERROR_BODY_MAX_BYTES:-8192}
      GATEWAY_OPENAI_WS_MODE_ROUTER_V2_ENABLED: ${GATEWAY_OPENAI_WS_MODE_ROUTER_V2_ENABLED:-false}
      # 保留previous_response_not_found给客户端整史重试；Sub2API自恢复会静默丢上下文。
      GATEWAY_OPENAI_WS_INGRESS_PREVIOUS_RESPONSE_RECOVERY_ENABLED: ${GATEWAY_OPENAI_WS_INGRESS_PREVIOUS_RESPONSE_RECOVERY_ENABLED:-false}
      LOG_ROTATION_MAX_SIZE_MB: ${LOG_ROTATION_MAX_SIZE_MB:-20}
      LOG_ROTATION_MAX_BACKUPS: ${LOG_ROTATION_MAX_BACKUPS:-5}
      LOG_ROTATION_MAX_AGE_DAYS: ${LOG_ROTATION_MAX_AGE_DAYS:-7}
      HTTP_PROXY: http://sub2api-egress-relay:3128
      HTTPS_PROXY: http://sub2api-egress-relay:3128
      UPDATE_PROXY_URL: http://sub2api-egress-relay:3128
      NO_PROXY: 127.0.0.1,localhost,aisix,cli-proxy-api,postgres,redis,sub2api-egress-relay
      SSL_CERT_FILE: /etc/ssl/certs/ai-gateway-ca-bundle.pem
      TZ: ${TZ:-UTC}
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Cutover done (task 4.3): this relay now feeds Sub2API traffic to the
  # apisix-models gateway; apisix-models-netns owns 172.30.12.2 on the target net.
  sub2api-cpa-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8317,bind=172.30.11.3,reuseaddr,fork", "TCP4:172.30.12.2:9080,connect-timeout=10"]
    depends_on:
      apisix-models: {condition: service_started}
    networks:
      sub2api-cpa-source:
        aliases: [cli-proxy-api]
        ipv4_address: 172.30.11.3
      sub2api-cpa-target:
        ipv4_address: 172.30.12.3

  sub2api-postgres-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:5432,bind=172.30.13.3,reuseaddr,fork", "TCP4:172.30.14.2:5432,connect-timeout=10"]
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      sub2api-postgres-source:
        aliases: [postgres]
        ipv4_address: 172.30.13.3
      sub2api-postgres-target:
        ipv4_address: 172.30.14.3

  sub2api-redis-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:6379,bind=172.30.15.3,reuseaddr,fork", "TCP4:172.30.16.2:6379,connect-timeout=10"]
    depends_on:
      redis: {condition: service_healthy}
    networks:
      sub2api-redis-source:
        aliases: [redis]
        ipv4_address: 172.30.15.3
      sub2api-redis-target:
        ipv4_address: 172.30.16.3

  sub2api-squid-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3128,bind=172.30.19.3,reuseaddr,fork", "TCP4:172.30.20.2:3128,connect-timeout=10"]
    depends_on:
      egress-proxy: {condition: service_started}
    networks:
      sub2api-squid-source:
        aliases: [sub2api-egress-relay]
        ipv4_address: 172.30.19.3
      sub2api-squid-target:
        ipv4_address: 172.30.20.3

  apisix-host-netns:
    <<: *netns-owner
    ports:
      - "${APISIX_BIND_ADDRESS:-127.0.0.1}:${APISIX_PORT:-9080}:9080"
      # Models table operator listener: localhost and Tailscale only (trusted domain).
      - "127.0.0.1:9083:9083"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:9083:9083"
    networks:
      apisix-host-source:
        ipv4_address: 172.30.5.2
      host-apisix-target:
        ipv4_address: 172.30.6.3

  apisix-host-relay:
    <<: *socat-relay
    network_mode: service:apisix-host-netns
    command: ["TCP4-LISTEN:9080,bind=172.30.5.2,reuseaddr,fork", "TCP4:172.30.6.2:9080,connect-timeout=10"]
    depends_on:
      apisix-host-netns: {condition: service_started, restart: true}

  apisix-host-table-relay:
    <<: *socat-relay
    network_mode: service:apisix-host-netns
    command: ["TCP4-LISTEN:9083,bind=172.30.5.2,reuseaddr,fork", "TCP4:172.30.6.2:9083,connect-timeout=10"]
    depends_on:
      apisix-host-netns: {condition: service_started, restart: true}

  apisix-netns:
    <<: *netns-owner
    extra_hosts:
      - "ai-sse-keepalive-ingress-relay:172.30.9.3"
      - "apisix-models:172.30.45.3"
      - "model-catalog:172.30.46.3"
    networks:
      host-apisix-target:
        ipv4_address: 172.30.6.2
      cloudflared-apisix-target:
        ipv4_address: 172.30.8.2
      apisix-ai-sse-source:
        ipv4_address: 172.30.9.2
      front-catalog:
        ipv4_address: 172.30.45.2
      front-model-table:
        ipv4_address: 172.30.46.2

  apisix:
    image: ${APISIX_IMAGE:-docker.io/apache/apisix:3.19.0-debian}
    network_mode: service:apisix-netns
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        while awk 'NR > 1 && $$2 == "00000000" && $$8 == "00000000" {found=1} END {exit(found ? 0 : 1)}' /proc/net/route ||
        awk '$$1 == "00000000000000000000000000000000" && $$2 == "00" && $$10 != "lo" {found=1} END {exit(found ? 0 : 1)}' /proc/net/ipv6_route;
        do sleep 0.05; done;
        exec /docker-entrypoint.sh docker-start
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 320m
    cpus: 1.0
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    environment:
      APISIX_STAND_ALONE: "true"
    depends_on:
      apisix-netns: {condition: service_started, restart: true}
      apisix-host-relay: {condition: service_started}
      apisix-host-table-relay: {condition: service_started}
      apisix-ai-sse-relay: {condition: service_started, restart: true}
    volumes:
      - ./services/firewall/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro,Z
      - ./services/firewall/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro,Z
      - ./services/firewall/apisix/lua:/opt/apisix/custom:ro,Z
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9080; printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r line <&3; [[ \"$$line\" == *\" 404 \"* ]]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Operator bypasses public filtering, not the shared API authentication chain.
  operator-host-netns:
    <<: *netns-owner
    ports:
      - "${OPERATOR_BIND_ADDRESS:-127.0.0.1}:${OPERATOR_PORT:-8087}:8080"
    networks:
      operator-host-source:
        ipv4_address: 172.30.72.2
      host-operator-target:
        ipv4_address: 172.30.73.3

  operator-host-relay:
    <<: *socat-relay
    network_mode: service:operator-host-netns
    command: ["TCP4-LISTEN:8080,bind=172.30.72.2,reuseaddr,fork", "TCP4:172.30.73.2:8080,connect-timeout=10"]
    depends_on:
      operator-host-netns: {condition: service_started, restart: true}
      ai-sse-keepalive-proxy: {condition: service_started}

  ai-sse-keepalive-proxy-netns:
    <<: *netns-owner
    extra_hosts:
      - "sub2api-ai-sse-relay:172.30.25.3"
    networks:
      apisix-ai-sse-target:
        ipv4_address: 172.30.10.2
      host-operator-target:
        ipv4_address: 172.30.73.2
      ai-sse-sub2api-source:
        ipv4_address: 172.30.25.2

  ai-sse-keepalive-proxy:
    build:
      context: ./services/middleware/ai-sse-keepalive-proxy
    image: ${AI_SSE_KEEPALIVE_PROXY_IMAGE:-ghcr.io/xz-dev/ai-sse-keepalive-proxy:1c489390927a986b7aacd3ebdfef3ea33f51d15d@sha256:bc5e360f98a9c71766bef26fbd67d88e93a2e93b372fcd9e5245788475d336f3}
    pull_policy: build
    user: "65534:65534"
    network_mode: service:ai-sse-keepalive-proxy-netns
    restart: unless-stopped
    depends_on:
      ai-sse-keepalive-proxy-netns: {condition: service_started, restart: true}
      openai-api-cache-keeper: {condition: service_healthy, restart: true}
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    environment:
      UPSTREAM_URL: http://127.0.0.1:8085
      LISTEN_ADDR: :8080
      HEADER_WAIT: ${AI_SSE_KEEPALIVE_PROXY_HEADER_WAIT:-2s}
      IDLE_INTERVAL: ${AI_SSE_KEEPALIVE_PROXY_IDLE_INTERVAL:-15s}
      # Inspection buffers whole bodies in memory; 8 MiB plus a soft heap
      # limit keeps concurrent large-history turns inside mem_limit 128m.
      # Larger bodies pass through without keepalive heartbeats.
      GOMEMLIMIT: ${AI_SSE_KEEPALIVE_PROXY_GOMEMLIMIT:-96MiB}
      MAX_INSPECT_BODY_BYTES: ${AI_SSE_KEEPALIVE_PROXY_MAX_INSPECT_BODY_BYTES:-8388608}
      REQUIRE_NO_DEFAULT_ROUTE: "true"
      WS_PING_INTERVAL: ${AI_SSE_KEEPALIVE_PROXY_WS_PING_INTERVAL:-0s}
      WS_PING_TIMEOUT: ${AI_SSE_KEEPALIVE_PROXY_WS_PING_TIMEOUT:-5s}
      WS_WRITE_TIMEOUT: ${AI_SSE_KEEPALIVE_PROXY_WS_WRITE_TIMEOUT:-120s}
      WS_HANDSHAKE_TIMEOUT: ${AI_SSE_KEEPALIVE_PROXY_WS_HANDSHAKE_TIMEOUT:-10s}
    healthcheck:
      test: [CMD, /ai-sse-keepalive-proxy, healthcheck]
      interval: 30s
      timeout: 3s
      retries: 3

  apisix-ai-sse-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8080,bind=172.30.9.3,reuseaddr,fork", "TCP4:172.30.10.2:8080,connect-timeout=10"]
    depends_on:
      ai-sse-keepalive-proxy: {condition: service_started}
    networks:
      apisix-ai-sse-source:
        aliases: [ai-sse-keepalive-ingress-relay]
        ipv4_address: 172.30.9.3
      apisix-ai-sse-target:
        ipv4_address: 172.30.10.3

  ai-sse-sub2api-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8080,bind=172.30.25.3,reuseaddr,fork", "TCP4:172.30.26.2:8080,connect-timeout=10"]
    depends_on:
      sub2api: {condition: service_started}
    networks:
      ai-sse-sub2api-source:
        aliases: [sub2api-ai-sse-relay]
        ipv4_address: 172.30.25.3
      ai-sse-sub2api-target:
        ipv4_address: 172.30.26.3

  cloudflared-apisix-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:9080,bind=172.30.7.3,reuseaddr,fork", "TCP4:172.30.8.2:9080,connect-timeout=10"]
    depends_on:
      apisix: {condition: service_started}
    networks:
      cloudflared-apisix-source:
        aliases: [apisix-ingress]
        ipv4_address: 172.30.7.3
      cloudflared-apisix-target:
        ipv4_address: 172.30.8.3

  apisix-models-host-netns:
    <<: *netns-owner
    ports:
      - "${APISIX_MODELS_BIND_ADDRESS:-127.0.0.1}:${APISIX_MODELS_PORT:-9081}:9080"
    networks:
      apisix-models-host-source:
        ipv4_address: 172.30.33.2
      host-apisix-models-target:
        ipv4_address: 172.30.34.3

  apisix-models-host-relay:
    <<: *socat-relay
    network_mode: service:apisix-models-host-netns
    command: ["TCP4-LISTEN:9080,bind=172.30.33.2,reuseaddr,fork", "TCP4:172.30.34.2:9080,connect-timeout=10"]
    depends_on:
      apisix-models-host-netns: {condition: service_started, restart: true}

  apisix-models-netns:
    <<: *netns-owner
    extra_hosts:
      - "aisix:172.30.70.3"
      - "cpa:172.30.35.3"
      - "model-catalog:172.30.27.3"
    networks:
      host-apisix-models-target:
        ipv4_address: 172.30.34.2
      apisix-models-cpa-source:
        ipv4_address: 172.30.35.2
      apisix-models-catalog-source:
        ipv4_address: 172.30.27.2
      sub2api-cpa-target:
        ipv4_address: 172.30.12.2
      front-catalog:
        ipv4_address: 172.30.45.3
      apisix-models-aisix-source:
        ipv4_address: 172.30.70.2

  apisix-models:
    image: ${APISIX_MODELS_IMAGE:-${APISIX_IMAGE:-docker.io/apache/apisix:3.19.0-debian}}
    network_mode: service:apisix-models-netns
    entrypoint: [/usr/local/bin/start-apisix-models]
    command: []
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    environment:
      APISIX_STAND_ALONE: "true"
      CPA_API_KEY: ${CPA_API_KEY:?Set CPA_API_KEY in .env}
    depends_on:
      apisix-models-netns: {condition: service_started, restart: true}
      apisix-models-host-relay: {condition: service_started}
      apisix-models-cpa-relay: {condition: service_started, restart: true}
      apisix-models-catalog-relay: {condition: service_started, restart: true}
      aisix: {condition: service_started, restart: true}
      apisix-models-aisix-relay: {condition: service_started, restart: true}
    volumes:
      - ./services/routing/apisix-models/config.yaml:/usr/local/apisix/conf/config.yaml:ro,Z
      - ./services/routing/apisix-models/apisix.yaml:/opt/apisix.yaml.tpl:ro,Z
      - ./services/routing/apisix-models/routing_selector.lua:/opt/apisix/custom/routing_selector.lua:ro,Z
      - ./services/routing/apisix-models/start.sh:/usr/local/bin/start-apisix-models:ro,Z
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9080; printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r line <&3; [[ \"$$line\" == *\" 200 \"* ]]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Stateless WS termination before Sub2API; spools are bounded, disposable disk files.
  responses-ws-sse-bridge:
    image: ${RESPONSES_WS_SSE_BRIDGE_IMAGE:-ghcr.io/xz-dev/responses-ws-sse-bridge:83bb9819a5afbda0dbf0c6c7af998d92de82adae@sha256:9b5c28879f521bd52d13183a76fc7625271c317b07e571a5f5a945088c760fb6}
    user: "65534:65534"
    network_mode: service:ai-sse-keepalive-proxy-netns
    restart: unless-stopped
    depends_on:
      ai-sse-keepalive-proxy-netns: {condition: service_started, restart: true}
      ai-sse-sub2api-relay: {condition: service_started, restart: true}
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    volumes:
      - responses-ws-sse-bridge-spool:/spool
    environment:
      UPSTREAM_URL: http://sub2api-ai-sse-relay:8080
      LISTEN_ADDR: 127.0.0.1:8086
      # Keep the explicit probe port aligned; 8080 belongs to keepalive.
      PORT: "8086"
      SPOOL_DIR: /spool
      GOMEMLIMIT: 192MiB
    healthcheck:
      test: [CMD, /responses-ws-sse-bridge, healthcheck]
      interval: 30s
      timeout: 3s
      retries: 3

  # Shared cache owner before the bridge; it does not select CPA/AISIX models.
  openai-api-cache-keeper:
    build:
      context: ./services/middleware/openai-api-cache-keeper
    image: ${OPENAI_API_CACHE_KEEPER_IMAGE:-ghcr.io/xz-dev/openai-api-cache-keeper:ade3d346de4c342d24996c058f3542d9a2bd3e1f@sha256:b8e12e6d8a5caf74a17b4615754655df3f409c7ad5721bae40eb3ac768964c0f}
    pull_policy: build
    user: "65534:65534"
    network_mode: service:ai-sse-keepalive-proxy-netns
    restart: unless-stopped
    depends_on:
      ai-sse-keepalive-proxy-netns: {condition: service_started, restart: true}
      ai-sse-sub2api-relay: {condition: service_started, restart: true}
      responses-ws-sse-bridge: {condition: service_healthy}
    pids_limit: 64
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    volumes:
      # Disposable cache on a real disk volume, never tmpfs.
      - openai-api-cache-keeper-cache:/var/tmp/openai-api-cache-keeper
    environment:
      UPSTREAM_URL: http://127.0.0.1:8086
      IGNORE_CLIENT_STORE_FALSE: "true"
      LISTEN_ADDR: 127.0.0.1:8085
      STORE_DIR: /var/tmp/openai-api-cache-keeper
      GOMEMLIMIT: ${OPENAI_API_CACHE_KEEPER_GOMEMLIMIT:-256MiB}
      STORE_TTL: ${OPENAI_API_CACHE_KEEPER_STORE_TTL:-10m}
      STORE_MAX_ENTRIES: ${OPENAI_API_CACHE_KEEPER_STORE_MAX_ENTRIES:-100}
      STORE_MAX_BYTES: ${OPENAI_API_CACHE_KEEPER_STORE_MAX_BYTES:-0}
      REQUIRE_NO_DEFAULT_ROUTE: "true"
    healthcheck:
      test: [CMD, /openai-api-cache-keeper, healthcheck]
      interval: 30s
      timeout: 3s
      retries: 3

  apisix-models-cpa-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8317,bind=172.30.35.3,reuseaddr,fork", "TCP4:172.30.36.2:8317,connect-timeout=10"]
    depends_on:
      cli-proxy-api: {condition: service_started}
    networks:
      apisix-models-cpa-source:
        aliases: [cpa]
        ipv4_address: 172.30.35.3
      apisix-models-cpa-target:
        ipv4_address: 172.30.36.3

  apisix-models-catalog-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8090,bind=172.30.27.3,reuseaddr,fork", "TCP4:172.30.28.2:8090,connect-timeout=10"]
    depends_on:
      model-catalog: {condition: service_started}
    networks:
      apisix-models-catalog-source:
        aliases: [model-catalog]
        ipv4_address: 172.30.27.3
      apisix-models-catalog-target:
        ipv4_address: 172.30.28.3

  model-catalog-netns:
    <<: *netns-owner
    extra_hosts:
      - "aisix:172.30.64.3"
      - "cpa:172.30.29.3"
    networks:
      apisix-models-catalog-target:
        ipv4_address: 172.30.28.2
      catalog-cpa-source:
        ipv4_address: 172.30.29.2
      catalog-aisix-source:
        ipv4_address: 172.30.64.2
      front-model-table:
        ipv4_address: 172.30.46.3

  cpa-model-sync:
    build:
      context: ./services/cpa/cpa-model-sync
    image: ${CPA_MODEL_SYNC_IMAGE:-cpa-model-sync:v0.1.3}
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    environment:
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?Set CPA_MANAGEMENT_KEY in .env}
    volumes:
      - ${CPA_MODEL_SYNC_CONFIG:-./services/cpa/cpa-model-sync/config.example.json}:/app/config.json:ro,Z
    extra_hosts:
      - "cli-proxy-api:172.30.44.2"
    networks:
      model-sync-cpa:
        ipv4_address: 172.30.44.3
    depends_on:
      cli-proxy-api: {condition: service_healthy}

  model-catalog:
    build:
      context: ./services/routing/model-catalog
    image: ${MODEL_CATALOG_IMAGE:-ghcr.io/xz-dev/ai-gateway-model-catalog:ts-shadow-b4439caba423@sha256:c836e2bb3c829142403b9ed6d8a29c9324a0356f208c5b513f26ccdce663ce70}
    pull_policy: missing
    network_mode: service:model-catalog-netns
    restart: unless-stopped
    depends_on:
      model-catalog-netns: {condition: service_started, restart: true}
      aisix: {condition: service_started, restart: true}
      catalog-aisix-relay: {condition: service_started, restart: true}
      catalog-cpa-relay: {condition: service_started, restart: true}
    pids_limit: 64
    # Node 主进程堆上限 96 MiB，构建 worker 160 MiB；峰值实测 256 MiB，留 native 缓冲余量。
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test: [CMD, /model-catalog, healthcheck]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      LISTEN_ADDR: :8090
      CONFIG_PATH: /app/config.yaml
      CACHE_DIR: /var/cache/model-catalog
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?Set CPA_MANAGEMENT_KEY in .env}
      CPA_CLIENT_KEY: ${CPA_CLIENT_KEY:-${CPA_API_KEY:?Set CPA_CLIENT_KEY or CPA_API_KEY in .env}}
      AISIX_MODELS_URL: http://aisix:3000/v1/models
      AISIX_TOKEN: ${AISIX_CATALOG_KEY:?Set AISIX_CATALOG_KEY in .env}
    volumes:
      - ./services/routing/model-catalog/config.yaml:/app/config.yaml:ro,Z
      # 专用持久卷：元数据输入缓存跨重启/重建保留，只挂给 model-catalog。
      - model-catalog-cache:/var/cache/model-catalog

  catalog-cpa-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8317,bind=172.30.29.3,reuseaddr,fork", "TCP4:172.30.30.2:8317,connect-timeout=10"]
    depends_on:
      cli-proxy-api: {condition: service_started}
    networks:
      catalog-cpa-source:
        aliases: [cpa]
        ipv4_address: 172.30.29.3
      catalog-cpa-target:
        ipv4_address: 172.30.30.3

  aisix-netns:
    <<: *netns-owner
    ports:
      - "${AISIX_STATUS_BIND_ADDRESS:-127.0.0.1}:${AISIX_STATUS_PORT:-3001}:3001"
    extra_hosts:
      - "cpa:172.30.62.3"
    networks:
      aisix-host-source:
        ipv4_address: 172.30.66.2
      aisix-status-admin:
        ipv4_address: 172.30.68.2
      sub2api-aisix-target:
        ipv4_address: 172.30.61.2
      aisix-cpa-source:
        ipv4_address: 172.30.62.2
      catalog-aisix-target:
        ipv4_address: 172.30.65.2
      apisix-models-aisix-target:
        ipv4_address: 172.30.71.2

  # AISIX edges use the same one-way source/target relay shape as every other
  # internal edge. AISIX proxy (3000) and metrics (9090) bind only to their
  # explicit target/admin addresses, never to every interface.
  sub2api-aisix-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3000,bind=172.30.60.3,reuseaddr,fork", "TCP4:172.30.61.2:3000,connect-timeout=10"]
    depends_on:
      aisix: {condition: service_started}
    networks:
      sub2api-aisix-source:
        aliases: [aisix]
        ipv4_address: 172.30.60.3
      sub2api-aisix-target:
        ipv4_address: 172.30.61.3

  catalog-aisix-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3000,bind=172.30.64.3,reuseaddr,fork", "TCP4:172.30.65.2:3000,connect-timeout=10"]
    depends_on:
      aisix: {condition: service_started}
    networks:
      catalog-aisix-source:
        aliases: [aisix]
        ipv4_address: 172.30.64.3
      catalog-aisix-target:
        ipv4_address: 172.30.65.3

  apisix-models-aisix-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3000,bind=172.30.70.3,reuseaddr,fork", "TCP4:172.30.71.2:3000,connect-timeout=10"]
    depends_on:
      aisix: {condition: service_started}
    networks:
      apisix-models-aisix-source:
        aliases: [aisix]
        ipv4_address: 172.30.70.3
      apisix-models-aisix-target:
        ipv4_address: 172.30.71.3

  aisix-cpa-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8317,bind=172.30.62.3,reuseaddr,fork", "TCP4:172.30.63.2:8317,connect-timeout=10"]
    depends_on:
      cli-proxy-api: {condition: service_started}
    networks:
      aisix-cpa-source:
        aliases: [cpa]
        ipv4_address: 172.30.62.3
      aisix-cpa-target:
        ipv4_address: 172.30.63.3

  aisix-status:
    image: ${AISIX_STATUS_IMAGE:-ghcr.io/xz-dev/ai-gateway-aisix-status:0.2.3@sha256:4ea017ad0e84de8810f75ae637e4198ac56f692fe0447ae7924223010269de4f}
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      aisix: {condition: service_started, restart: true}
    pids_limit: 32
    mem_limit: 32m
    cpus: 0.2
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      AISIX_ADMIN_URL: http://172.30.68.2:3002
      AISIX_CONFIG_PATH: /etc/aisix/config.yaml
    volumes:
      - ./services/routing/aisix/config.yaml:/etc/aisix/config.yaml:ro,Z
    networks:
      aisix-status-admin:
        ipv4_address: 172.30.68.3

  aisix-status-relay:
    <<: *socat-relay
    network_mode: service:aisix-netns
    command: ["TCP4-LISTEN:3001,bind=172.30.66.2,reuseaddr,fork", "TCP4:172.30.68.3:8080,connect-timeout=3"]
    depends_on:
      aisix-netns: {condition: service_started, restart: true}
      aisix-status: {condition: service_started}

  aisix:
    image: ${AISIX_IMAGE:-ghcr.io/api7/aisix:1.5.0@sha256:336040687c0702d43b36d2ec27433390503217b573ffcc2e314c8744355f2000}
    network_mode: service:aisix-netns
    command: ["--config", "/etc/aisix/config.yaml"]
    restart: unless-stopped
    depends_on:
      aisix-netns: {condition: service_started, restart: true}
      cli-proxy-api: {condition: service_healthy}
      aisix-cpa-relay: {condition: service_started, restart: true}
    pids_limit: 128
    mem_limit: 192m
    memswap_limit: 256m
    cpus: 1.0
    read_only: true
    cap_drop: [ALL]
    # The pinned AISIX binary carries cap_net_bind_service=ep; retain only
    # that capability in the bounding set so exec works under no-new-privileges.
    cap_add: [NET_BIND_SERVICE]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    volumes:
      - ./services/routing/aisix/config.yaml:/etc/aisix/config.yaml:ro,Z
      - ./services/routing/aisix/resources.yaml:/etc/aisix/resources.yaml:ro,Z

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-docker.io/cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07}
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env}
    extra_hosts:
      - "apisix-ingress:172.30.7.3"
    depends_on:
      cloudflared-apisix-relay: {condition: service_started, restart: true}
    networks:
      cloudflared-apisix-source:
        ipv4_address: 172.30.7.2
      cloudflare-egress:
        gw_priority: 1

volumes:
  openai-api-cache-keeper-cache: {}
  model-catalog-cache: {}
  responses-ws-sse-bridge-spool: {}

networks:
  apisix-models-aisix-source:
