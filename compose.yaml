name: ai-gateway

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-netns-owner: &netns-owner
  image: ${NETNS_GUARD_IMAGE:-docker.io/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1}
  restart: unless-stopped
  pids_limit: 16
  mem_limit: 16m
  memswap_limit: 16m
  cpus: 0.1
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETGID, SETUID]
  logging: *default-logging
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=1m"]
  command:
    - /bin/sh
    - -ec
    - >-
      while ip -4 route show default | grep -q .; do ip -4 route del default; done;
      while ip -6 route show default | grep -q .; do ip -6 route del default; done;
      test -z "$$(ip -4 route show default)";
      test -z "$$(ip -6 route show default)";
      exec su nobody -s /bin/sh -c 'exec sleep infinity'

x-socat-relay: &socat-relay
  image: ${SOCAT_IMAGE:-docker.io/alpine/socat@sha256:3d9e7966201dd3a065df591020a09fd3c70845de7e7086e3531ea69db774406b}
  user: "65534:65534"
  restart: unless-stopped
  pids_limit: 64
  mem_limit: 32m
  memswap_limit: 32m
  cpus: 0.2
  read_only: true
  cap_drop: [ALL]
  logging: *default-logging
  security_opt: [no-new-privileges:true]

services:
  egress-proxy:
    build:
      context: ./egress-proxy
    image: ${EGRESS_PROXY_IMAGE:-ai-gateway-squid:6.13-2-deb13u2}
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/lib/squid/ssl_db:rw,noexec,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./data/egress-proxy/generated:/etc/squid/generated:ro,Z
      - ./data/egress-proxy/ca.crt:/etc/squid/ca.crt:ro,z
      - ./data/egress-proxy/ca.key:/etc/squid/ca.key:ro,Z
    networks:
      cpa-squid-target:
        ipv4_address: 172.30.18.2
      sub2api-squid-target:
        ipv4_address: 172.30.20.2
      proxy-egress:
        gw_priority: 1
    healthcheck:
      test: [CMD-SHELL, "/usr/sbin/unbound-control -c /etc/unbound/ai-gateway.conf status && /usr/sbin/squid -k check -f /etc/squid/generated/squid.conf"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  cpa-host-netns:
    <<: *netns-owner
    ports:
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:${CPA_PORT:-8317}:8317"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:8085:8085"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:1455:1455"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:54545:54545"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:51121:51121"
      - "${CPA_BIND_ADDRESS:-127.0.0.1}:11451:11451"
    networks:
      cpa-host-source:
        ipv4_address: 172.30.1.2
      host-cpa-target:
        ipv4_address: 172.30.2.3

  cpa-host-relay:
    <<: *socat-relay
    network_mode: service:cpa-host-netns
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        pids=
        for port in 8317 8085 1455 54545 51121 11451; do
          socat "TCP4-LISTEN:$${port},reuseaddr,fork" "TCP4:172.30.2.2:$${port},connect-timeout=10" &
          pids="$${pids} $$!"
        done
        trap 'kill $${pids} 2>/dev/null; wait $${pids} 2>/dev/null' EXIT INT TERM
        wait -n
    depends_on:
      cpa-host-netns:
        condition: service_started
        restart: true

  cpa-netns:
    <<: *netns-owner
    extra_hosts:
      - "cpa-egress-relay:172.30.17.3"
    networks:
      host-cpa-target:
        aliases: [cli-proxy-api]
        ipv4_address: 172.30.2.2
      sub2api-cpa-target:
        ipv4_address: 172.30.12.2
      cpa-squid-source:
        ipv4_address: 172.30.17.2

  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/xz-dev/cli-proxy-api@sha256:1da1d6ab90c2d7a569e8ebcb6eeb25549e2a535b03fbac54f11ceca189c49ae8}
    network_mode: service:cpa-netns
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        while awk 'NR > 1 && $$2 == "00000000" && $$8 == "00000000" {found=1} END {exit(found ? 0 : 1)}' /proc/net/route ||
        awk '$$1 == "00000000000000000000000000000000" && $$2 == "00" && $$10 != "lo" {found=1} END {exit(found ? 0 : 1)}' /proc/net/ipv6_route;
        do sleep 0.05; done;
        exec ./CLIProxyAPI -config /CLIProxyAPI/conf/config.yaml
    restart: unless-stopped
    depends_on:
      cpa-netns: {condition: service_started, restart: true}
      cpa-host-relay: {condition: service_started}
      cpa-squid-relay: {condition: service_started, restart: true}
    pids_limit: 256
    mem_limit: 480m
    memswap_limit: 480m
    cpus: 1.75
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    environment:
      DEPLOY: docker-compose
      HTTP_PROXY: http://cpa-egress-relay:3128
      HTTPS_PROXY: http://cpa-egress-relay:3128
      NO_PROXY: 127.0.0.1,localhost,cli-proxy-api,cpa-egress-relay
      SSL_CERT_FILE: /etc/ssl/certs/ai-gateway-ca-bundle.pem
    volumes:
      - ./data/cpa/conf:/CLIProxyAPI/conf:Z
      - ./data/cpa/auths:/root/.cli-proxy-api:Z
      - ./data/cpa/logs:/CLIProxyAPI/logs:Z
      - ./data/cpa/plugins:/CLIProxyAPI/plugins:Z
      - ./data/cpa/runtime:/CLIProxyAPI/data:Z
      - ./data/cpa/mgmt.key:/CLIProxyAPI/mgmt.key:ro,Z
      - ./data/egress-proxy/ca-bundle.pem:/etc/ssl/certs/ai-gateway-ca-bundle.pem:ro,z
    healthcheck:
      test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8317; printf 'HEAD /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r line <&3; [[ \"$$line\" == *\" 200 \"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cpa-squid-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3128,bind=172.30.17.3,reuseaddr,fork", "TCP4:172.30.18.2:3128,connect-timeout=10"]
    depends_on:
      egress-proxy: {condition: service_started}
    networks:
      cpa-squid-source:
        aliases: [cpa-egress-relay]
        ipv4_address: 172.30.17.3
      cpa-squid-target:
        ipv4_address: 172.30.18.3

  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8}
    command: [postgres, -c, max_connections=50, -c, shared_buffers=64MB]
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 400m
    memswap_limit: 400m
    cpus: 1.0
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,size=16m,mode=3777
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-UTC}
    volumes: [./data/sub2api/postgres:/var/lib/postgresql:Z]
    networks:
      sub2api-postgres-target:
        ipv4_address: 172.30.14.2
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis@sha256:9c3ecc609a8087c0f11c494fefaf37a8f7bf9a967631d4a0da8967a9810be354}
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 80m
    memswap_limit: 80m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    command:
      - /bin/sh
      - -ec
      - |
        set -- redis-server --save 60 1 --appendonly yes --appendfsync everysec
        if [ -n "$${REDIS_PASSWORD:-}" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes: [./data/sub2api/redis:/data:Z]
    networks:
      sub2api-redis-target:
        ipv4_address: 172.30.16.2
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  sub2api-host-netns:
    <<: *netns-owner
    ports:
      - "${SUB2API_BIND_ADDRESS:-127.0.0.1}:${SUB2API_PORT:-8086}:8080"
    networks:
      sub2api-host-source:
        ipv4_address: 172.30.3.2
      host-sub2api-target:
        ipv4_address: 172.30.4.3

  sub2api-host-relay:
    <<: *socat-relay
    network_mode: service:sub2api-host-netns
    command: ["TCP4-LISTEN:8080,reuseaddr,fork", "TCP4:172.30.4.2:8080,connect-timeout=10"]
    depends_on:
      sub2api-host-netns: {condition: service_started, restart: true}

  sub2api-netns:
    <<: *netns-owner
    extra_hosts:
      - "cli-proxy-api:172.30.11.3"
      - "postgres:172.30.13.3"
      - "redis:172.30.15.3"
      - "sub2api-egress-relay:172.30.19.3"
    networks:
      host-sub2api-target:
        ipv4_address: 172.30.4.2
      apisix-sub2api-target:
        aliases: [sub2api]
        ipv4_address: 172.30.10.2
      sub2api-cpa-source:
        ipv4_address: 172.30.11.2
      sub2api-postgres-source:
        ipv4_address: 172.30.13.2
      sub2api-redis-source:
        ipv4_address: 172.30.15.2
      sub2api-squid-source:
        ipv4_address: 172.30.19.2

  sub2api:
    image: ${SUB2API_IMAGE:-ghcr.io/wei-shaw/sub2api@sha256:b0b9dec5ab978e8b872cedc2706e695c944b5322ae56b20ba99ee9d3871fe810}
    network_mode: service:sub2api-netns
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        while awk 'NR > 1 && $$2 == "00000000" && $$8 == "00000000" {found=1} END {exit(found ? 0 : 1)}' /proc/net/route ||
        awk '$$1 == "00000000000000000000000000000000" && $$2 == "00" && $$10 != "lo" {found=1} END {exit(found ? 0 : 1)}' /proc/net/ipv6_route;
        do sleep 0.05; done;
        exec /app/docker-entrypoint.sh /app/sub2api
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.5
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    depends_on:
      sub2api-netns: {condition: service_started, restart: true}
      sub2api-host-relay: {condition: service_started}
      sub2api-cpa-relay: {condition: service_started, restart: true}
      sub2api-postgres-relay: {condition: service_started, restart: true}
      sub2api-redis-relay: {condition: service_started, restart: true}
      sub2api-squid-relay: {condition: service_started, restart: true}
    volumes:
      - ./data/sub2api/app:/app/data:Z
      - ./data/egress-proxy/ca-bundle.pem:/etc/ssl/certs/ai-gateway-ca-bundle.pem:ro,z
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      RUN_MODE: ${SUB2API_RUN_MODE:-standard}
      SERVER_TRUSTED_PROXIES: ${SUB2API_TRUSTED_PROXIES:-172.30.10.3/32}
      SECURITY_TRUST_FORWARDED_IP_FOR_API_KEY_ACL: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECURITY_URL_ALLOWLIST_ENABLED: "false"
      GATEWAY_MODELS_LIST_READ_MAX_BYTES: ${GATEWAY_MODELS_LIST_READ_MAX_BYTES:-16777216}
      LOG_ROTATION_MAX_SIZE_MB: ${LOG_ROTATION_MAX_SIZE_MB:-20}
      LOG_ROTATION_MAX_BACKUPS: ${LOG_ROTATION_MAX_BACKUPS:-5}
      LOG_ROTATION_MAX_AGE_DAYS: ${LOG_ROTATION_MAX_AGE_DAYS:-7}
      HTTP_PROXY: http://sub2api-egress-relay:3128
      HTTPS_PROXY: http://sub2api-egress-relay:3128
      NO_PROXY: 127.0.0.1,localhost,cli-proxy-api,postgres,redis,sub2api-egress-relay
      SSL_CERT_FILE: /etc/ssl/certs/ai-gateway-ca-bundle.pem
      TZ: ${TZ:-UTC}
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sub2api-cpa-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8317,bind=172.30.11.3,reuseaddr,fork", "TCP4:172.30.12.2:8317,connect-timeout=10"]
    depends_on:
      cli-proxy-api: {condition: service_started}
    networks:
      sub2api-cpa-source:
        aliases: [cli-proxy-api]
        ipv4_address: 172.30.11.3
      sub2api-cpa-target:
        ipv4_address: 172.30.12.3

  sub2api-postgres-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:5432,bind=172.30.13.3,reuseaddr,fork", "TCP4:172.30.14.2:5432,connect-timeout=10"]
    depends_on:
      postgres: {condition: service_started}
    networks:
      sub2api-postgres-source:
        aliases: [postgres]
        ipv4_address: 172.30.13.3
      sub2api-postgres-target:
        ipv4_address: 172.30.14.3

  sub2api-redis-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:6379,bind=172.30.15.3,reuseaddr,fork", "TCP4:172.30.16.2:6379,connect-timeout=10"]
    depends_on:
      redis: {condition: service_started}
    networks:
      sub2api-redis-source:
        aliases: [redis]
        ipv4_address: 172.30.15.3
      sub2api-redis-target:
        ipv4_address: 172.30.16.3

  sub2api-squid-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:3128,bind=172.30.19.3,reuseaddr,fork", "TCP4:172.30.20.2:3128,connect-timeout=10"]
    depends_on:
      egress-proxy: {condition: service_started}
    networks:
      sub2api-squid-source:
        aliases: [sub2api-egress-relay]
        ipv4_address: 172.30.19.3
      sub2api-squid-target:
        ipv4_address: 172.30.20.3

  apisix-host-netns:
    <<: *netns-owner
    ports:
      - "${APISIX_BIND_ADDRESS:-127.0.0.1}:${APISIX_PORT:-9080}:9080"
    networks:
      apisix-host-source:
        ipv4_address: 172.30.5.2
      host-apisix-target:
        ipv4_address: 172.30.6.3

  apisix-host-relay:
    <<: *socat-relay
    network_mode: service:apisix-host-netns
    command: ["TCP4-LISTEN:9080,reuseaddr,fork", "TCP4:172.30.6.2:9080,connect-timeout=10"]
    depends_on:
      apisix-host-netns: {condition: service_started, restart: true}

  apisix-netns:
    <<: *netns-owner
    extra_hosts:
      - "sub2api-apisix-relay:172.30.9.3"
    networks:
      host-apisix-target:
        ipv4_address: 172.30.6.2
      cloudflared-apisix-target:
        ipv4_address: 172.30.8.2
      apisix-sub2api-source:
        ipv4_address: 172.30.9.2

  apisix:
    image: ${APISIX_IMAGE:-docker.io/apache/apisix@sha256:51bb7b7fcd4162bec53f276c5a9b7b93d5de55723586842becb3e5f165fc0281}
    network_mode: service:apisix-netns
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        while awk 'NR > 1 && $$2 == "00000000" && $$8 == "00000000" {found=1} END {exit(found ? 0 : 1)}' /proc/net/route ||
        awk '$$1 == "00000000000000000000000000000000" && $$2 == "00" && $$10 != "lo" {found=1} END {exit(found ? 0 : 1)}' /proc/net/ipv6_route;
        do sleep 0.05; done;
        exec /docker-entrypoint.sh docker-start
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1.0
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    environment:
      APISIX_STAND_ALONE: "true"
    depends_on:
      apisix-netns: {condition: service_started, restart: true}
      apisix-host-relay: {condition: service_started}
      apisix-sub2api-relay: {condition: service_started, restart: true}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro,Z
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro,Z
      - ./apisix/lua:/opt/apisix/custom:ro,Z
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9080; printf 'GET /v1/models HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r line <&3; [[ \"$$line\" == *\" 404 \"* ]]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  apisix-sub2api-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:8080,bind=172.30.9.3,reuseaddr,fork", "TCP4:172.30.10.2:8080,connect-timeout=10"]
    depends_on:
      sub2api: {condition: service_started}
    networks:
      apisix-sub2api-source:
        aliases: [sub2api-apisix-relay]
        ipv4_address: 172.30.9.3
      apisix-sub2api-target:
        ipv4_address: 172.30.10.3

  cloudflared-apisix-relay:
    <<: *socat-relay
    command: ["TCP4-LISTEN:9080,bind=172.30.7.3,reuseaddr,fork", "TCP4:172.30.8.2:9080,connect-timeout=10"]
    depends_on:
      apisix: {condition: service_started}
    networks:
      cloudflared-apisix-source:
        aliases: [apisix-ingress]
        ipv4_address: 172.30.7.3
      cloudflared-apisix-target:
        ipv4_address: 172.30.8.3

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-docker.io/cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38}
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env}
    extra_hosts:
      - "apisix-ingress:172.30.7.3"
    depends_on:
      cloudflared-apisix-relay: {condition: service_started, restart: true}
    networks:
      cloudflared-apisix-source:
        ipv4_address: 172.30.7.2
      cloudflare-egress:
        gw_priority: 1

networks:
