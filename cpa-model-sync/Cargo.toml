[package]
name = "cpa-model-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
percent-encoding = "2.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tiny_http = "0.12"
