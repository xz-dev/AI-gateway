server:
  interface: 127.0.0.1
  port: 53
  username: ""
  chroot: ""
  directory: "/tmp"
  pidfile: "/tmp/unbound.pid"
  logfile: ""
  use-syslog: no
  verbosity: 1
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  outgoing-range: 512
  access-control: 127.0.0.0/8 allow
  module-config: "iterator"
  qname-minimisation: yes
  harden-glue: yes
  hide-identity: yes
  hide-version: yes
  cache-max-ttl: 300
  cache-min-ttl: 0
  msg-cache-size: 8m
  rrset-cache-size: 16m

  # Strip all non-global, transition, documentation, metadata, and reserved
  # answers before Squid can select an origin address. This pins the filtered
  # answer in Unbound's cache and closes DNS-rebinding and mixed-answer gaps.
  private-address: 0.0.0.0/8
  private-address: 10.0.0.0/8
  private-address: 100.64.0.0/10
  private-address: 127.0.0.0/8
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 192.0.0.0/24
  private-address: 192.0.2.0/24
  private-address: 192.88.99.0/24
  private-address: 192.168.0.0/16
  private-address: 198.18.0.0/15
  private-address: 198.51.100.0/24
  private-address: 203.0.113.0/24
  private-address: 224.0.0.0/4
  private-address: 240.0.0.0/4
  private-address: ::/3
  private-address: 4000::/2
  private-address: 8000::/1
  private-address: 2001::/23
  private-address: 2001:db8::/32
  private-address: 2002::/16
  private-address: 3ffe::/16
  private-address: 3fff::/20

remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-port: 8953
  control-use-cert: no
