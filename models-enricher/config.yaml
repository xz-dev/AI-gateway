cpa_base_url: http://cpa:8317
source_ttl: 10m
channel_timeout: 8s
overall_deadline: 25s
# Optional per-channel path / regex / field overrides. Keys match CPA name or prefix.
channels: {}

# 公开裸别名（fallback 链公开名，APISIX ai-proxy-multi 承载路由）
# 有序链式继承：codex（暂停，缺失=空模板）→ axis → overrides 盖顶。
static_models:
  - slug: gpt-5.6-sol
    inherit: [id@gpt-5.6-sol, axis/gpt-5.6-sol]
    overrides:
      display_name: GPT-5.6 Sol
      description: 公开别名；fallback 链 codex(暂停)→axis
  - slug: gpt-5.6-terra
    inherit: [id@gpt-5.6-terra, axis/gpt-5.6-terra]
    overrides:
      display_name: GPT-5.6 Terra
      description: 公开别名；fallback 链 codex(暂停)→axis
  - slug: team-a/gpt-5.6-sol
    inherit: [id@gpt-5.6-sol]
    overrides:
      display_name: Team-A GPT-5.6 Sol
      description: 含斜杠别名 drill；池 axis
  - slug: grok-4.6
    inherit: [xl/grok-4.6]
    overrides:
      display_name: Grok 4.6
      description: 公开别名；LB 池 grok-oauth+xl
  - slug: gpt-5.6-luna
    inherit: [id@gpt-5.6-luna, axis/gpt-5.6-luna]
    overrides:
      display_name: GPT-5.6 Luna
      description: 公开别名；fallback 链 codex(暂停)→axis
  # GLM-5.3：官方（docs.z.ai）1M ctx / 128K out 由源填充；推理恒开，effort low/high/max。
  - slug: zcode/glm-5.3
    overrides:
      supported_reasoning_levels: [{effort: low}, {effort: high}, {effort: max}]
      default_reasoning_level: max
  # Sub2API 目录裸名条目：继承带前缀池条目（已剥模板+源填充），
  # 让 Sub2API 本地目录的元数据查找命中真值而不是硬编码 272000 兜底。
  - slug: glm-5.3
    inherit: [id@zcode/glm-5.3, zcode/glm-5.3]
