# models-enricher 配置；channels.<key> 精确匹配 CPA prefix。
# 未配置的渠道保留CPA基线；已配置渠道默认获取自身目录。
# 无 source_priority 时不请求外部补全来源。
# 已启用步骤无可用缓存且失败时，整个渠道退回纯CPA记录。
cpa_base_url: http://cpa:8317
http_concurrency: 8
channels:
  axis:
    fetch_models: false
    source_priority: [models.dev/openai]
  congee:
    fetch_models: false
    source_priority: [models.dev/openai]
  xl:
    source_priority: [modelparams.dev/xai/subscription, models.dev/openai, models.dev/xai, models.dev/zai-coding-plan, models.dev/moonshotai, models.dev/deepseek, models.dev/tencent]
    models:
      muse-spark-1.3-contributor:
        source_priority: [models.dev/meta]
  zcode:
    source_priority: [models.dev/zai-coding-plan, modelparams.dev/z-ai/subscription, models.dev/zai]
  ollama-cloud:
    ollama_native_base_url: https://ollama.com
    source_priority: [ollama_cloud, models.dev/ollama-cloud]
  nim:
    source_priority: [models.dev/nvidia]
    # NVIDIA来源使用完整厂商路径；仅映射provider会丢失ID中的厂商部分。
    provider_prefix_map:
      deepseek-ai: nvidia
      minimaxai: nvidia
    models:
      deepseek-ai/deepseek-v4-flash-0731:
        lookup_ids:
          models.dev/nvidia: deepseek-ai/deepseek-v4-flash-0731
      minimaxai/minimax-m3:
        lookup_ids:
          models.dev/nvidia: minimaxai/minimax-m3
  shuaiapi:
    source_priority: [models.dev/anthropic]
  commandcode:
    source_priority: [models.dev/openai, models.dev/anthropic]
    # 只转换查询前缀；厂家目录参考不代表渠道实测能力。
    provider_prefix_map:
      MiniMaxAI: minimax
      Qwen: alibaba
      z-ai: zai
      zai-org: zai
  gmicloud: {}

# CPA原始裸名在入口过滤；static用虚空池取数，不依赖真实渠道成员。
# static-parents 是订阅型数据链：成员仅存在于本池，从models.dev取真实厂商声明。
# statics层用overrides把gpt四项的context压到372k（真实供应商限额），池内保持来源原值。
custom_channels:
  static-parents:
    source_priority: [models.dev/openai, models.dev/xai]
    models:
      gpt-5.6-sol: {}
      gpt-5.6-terra: {}
      gpt-5.6-luna: {}
      gpt-6-astra: {}
      grok-4.6: {}

static_models:
  - slug: gpt-5.6-sol
    inherit: [static-parents/gpt-5.6-sol]
    overrides: {context_window: 372000, max_context_window: 372000}
  - slug: gpt-5.6-terra
    inherit: [static-parents/gpt-5.6-terra]
    overrides: {context_window: 372000, max_context_window: 372000}
  - slug: gpt-5.6-luna
    inherit: [static-parents/gpt-5.6-luna]
    overrides: {context_window: 372000, max_context_window: 372000}
  - slug: gpt-6-astra
    inherit: [static-parents/gpt-6-astra]
    overrides: {context_window: 372000, max_context_window: 372000}
  - slug: grok-4.6
    inherit: [static-parents/grok-4.6]
