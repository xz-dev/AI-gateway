[defaults]
# The production inventory is private (gitignored); see inventories/example/.
inventory = private-config/inventories/production/hosts.yml
roles_path = roles
collections_path = ./collections
collections_scan_sys_path = false
result_format = yaml
display_skipped_hosts = false
retry_files_enabled = false
interpreter_python = auto_silent
gathering = explicit

[ssh_connection]
# A PTY lets PAM emit OSC context before async JSON, breaking module decoding.
usetty = false
