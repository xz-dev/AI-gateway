---
# Restore the pre-deploy copy of one configuration file and verify its service.
#   ansible-playbook playbooks/rollback-config.yml -e component=<cpa-model-sync|model-catalog> [--check --diff]
- name: Roll back one AI-gateway configuration
  hosts: gateway
  gather_facts: false
  module_defaults:
    community.docker.docker_compose_v2: &ai_ops_compose
      project_src: "{{ ai_ops_compose_project_src }}"
      project_name: "{{ ai_ops_compose_project }}"
      files: "{{ ai_ops_compose_files }}"
      env_files: "{{ ai_ops_compose_env_files }}"
    community.docker.docker_compose_v2_exec: *ai_ops_compose
  vars:
    rollback_config_roles:
      cpa-model-sync: ai_ops_model_sync
      model-catalog: ai_ops_model_catalog
  pre_tasks:
    # Runs on the controller before any connection; the message lists the choices.
    - name: Validate the component
      ansible.builtin.validate_argument_spec:
        argument_spec:
          component:
            type: str
            required: true
            choices: [cpa-model-sync, model-catalog]
        provided_arguments:
          component: "{{ component | default(omit) }}"
      tags: [always]
  roles:
    # Shared preflight; the play-level role also makes its defaults play-wide.
    - role: ai_ops
      tags: [always]
  tasks:
    - name: Roll back the selected configuration
      ansible.builtin.include_role:
        name: "{{ rollback_config_roles[component] }}"
        tasks_from: rollback
      tags: [always]
