---
# ai_ops role defaults — every operator-tunable variable lives here.
# Override any of these in inventory/group_vars/ or host_vars/ (see examples/vars.yml).
# Internal temporaries use a leading underscore and are NOT declared here.

# Absolute path to the operator's private config directory (never committed).
# Contains: compose.yaml, compose.override.yaml, .env, services/routing/aisix/resources.yaml,
# services/cpa/cpa-model-sync/config.json, data/egress-proxy/policy.json — adopted from production at baseline.
# data/cpa/conf/config.yaml is worker-owned; an optional private copy is a
# bootstrap seed only, never a deploy source or baseline.
ai_ops_config_dir: "{{ playbook_dir }}/private-config"

# Remote deployment root on the gateway host.
ai_ops_deploy_root: /root/AI-gateway

# Compose project name on the remote.
ai_ops_compose_project: ai-gateway

# Compose provider command. Empty = auto-detect on the remote
# (docker compose | podman compose | podman-compose), mirroring ops/scripts/container-runtime.sh.
ai_ops_compose_cmd: ""

# Container runtime override for detection ('docker' or 'podman'). Empty = auto-detect.
ai_ops_runtime: ""

# Execution mode: 'apply' performs the operation; 'plan' is read-only
# (shows the effective diff against the remote, never writes).
ai_ops_mode: apply

# Capacity gate thresholds for component deploys (no tuning of the host itself).
# Default 200MB reflects small-host reality (rainyun-la: 2GB total, ~250-330MB
# available steady-state); raise per-host in host_vars for bigger machines.
ai_ops_min_mem_mb: 200
ai_ops_min_disk_mb: 1024

# Component profiles supported by the component-deploy operation.
ai_ops_profiles:
  cli-proxy-api: {}
  sub2api: {}
  aisix: {}
  # Production uses an archive-preloaded rollback-* image whose config ID differs
  # from the registry image; bind the local ID and never try to pull the alias.
  cloudflared:
    pull: false
  ai-sse-keepalive-proxy: {}
  openai-api-cache-keeper:
    front_cache: true
    env:
      LISTEN_ADDR: '127.0.0.1:8085'
      UPSTREAM_URL: 'http://127.0.0.1:8086'
      IGNORE_CLIENT_STORE_FALSE: 'true'
  responses-ws-sse-bridge:
    front_cache: true
    env:
      LISTEN_ADDR: '127.0.0.1:8086'
      PORT: '8086'
      UPSTREAM_URL: 'http://sub2api-ai-sse-relay:8080'
  provider-sidecar: {}
  aisix-status: {}
  models-enricher: {}
  model-catalog-sidecar: {}
  apisix: {}
  apisix-models: {}
  # Production uses an archive-preloaded localhost image; component deploy must
  # not contact a registry for this service.
  cpa-model-sync:
    pull: false
  # Squid is built locally on the host from services/firewall/egress-proxy/; never pulled.
  egress-proxy:
    pull: false

# Shared component operations need Docker Compose v2 on the controller for an
# offline, secret-suppressed candidate render. No local Docker daemon is used.
ai_ops_local_compose_cmd: docker compose
# Plan identity binds all three candidate/live file hashes and container IDs.
ai_ops_front_approved_digest: ''
ai_ops_front_verify_retries: 30
ai_ops_front_verify_delay_seconds: 2
# Per Docker pull/recreate step. Allow >=1800s for the whole controller command.
ai_ops_component_command_timeout: 600
# A recovery needs this exact owned transaction, local/remote liveness checks,
# and a lock at least 15 minutes old. It never changes config or activates it.
ai_ops_lock_transaction: ''
ai_ops_lock_min_age_seconds: 900

# Model-sync deploy: exact preview digest approved from ai_ops_mode=plan.
ai_ops_model_sync_approved_digest: ""

# Model-sync verification waits this many attempts for the immediate first round.
ai_ops_model_sync_verify_retries: 30
ai_ops_model_sync_verify_delay_seconds: 2

# Maximum current-container log lines examined for the first round summary.
ai_ops_model_sync_log_tail: 200

# Models-enricher config deploy: bounded wait for the recreated container's
# readiness (/readyz via its healthcheck subcommand).
ai_ops_models_enricher_verify_retries: 30
ai_ops_models_enricher_verify_delay_seconds: 2

# ai-sse-keepalive-proxy deploy: bounded wait for the recreated container's
# healthcheck subcommand after a digest-pinned recreate.
ai_ops_ws_keepalive_verify_retries: 30
ai_ops_ws_keepalive_verify_delay_seconds: 2
# Exact image digest approved from ai_ops_mode=plan; apply refuses without it.
ai_ops_ws_keepalive_approved_digest: ""
# Optional OCI source revision the running image must carry (source SHA).
ai_ops_ws_keepalive_expected_revision: ""

# Pinned Squid image used for offline `-k parse` validation of rendered policy.
ai_ops_squid_image: ai-gateway-squid:6.13-2-deb13u3-r1

# AISIX deploy: direct-connect models explicitly adopted into resources.yaml
# (reported orphans require this list to approve deletion from the effective set).
ai_ops_adopted_direct_models: []

# AISIX deploy: direct-connect models intentionally kept standalone (excluded from
# orphan candidacy).
ai_ops_standalone_retained: []
