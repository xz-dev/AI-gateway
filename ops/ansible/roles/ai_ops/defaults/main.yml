---
# ai_ops shared defaults. Every operator-tunable variable of this role lives here;
# override them in the inventory (group_vars/ or host_vars/). Internal facts use
# the __ai_ops_ prefix and are not declared here.

# Private desired-state directory on the controller (never committed): compose.yaml,
# compose.override.yaml, .env, services/routing/aisix/resources.yaml,
# services/cpa/cpa-model-sync/config.json, services/routing/model-catalog/config.yaml,
# data/egress-proxy/policy.json. data/cpa/conf/config.yaml is worker-owned; a
# private copy is only a bootstrap seed, never a deploy source or baseline.
ai_ops_config_dir: "{{ (role_path ~ '/../../private-config') | realpath }}"

# Controller copy of ops/scripts (host helpers and recovery units).
ai_ops_scripts_dir: "{{ (role_path ~ '/../../../scripts') | realpath }}"

# Remote deployment root and Compose project on the gateway host.
ai_ops_deploy_root: /root/AI-gateway
ai_ops_compose_project: ai-gateway

# Compose provider command. Empty = auto-detect on the remote
# (docker compose | podman compose | podman-compose), mirroring ops/scripts/container-runtime.sh.
ai_ops_compose_cmd: ""

# Container runtime override for detection ('docker' or 'podman'). Empty = auto-detect.
ai_ops_runtime: ""

# Compose files and env file of the deployment, shared by the env -i argv
# (ai_ops_compose_argv) and the community.docker module_defaults of every playbook.
ai_ops_compose_project_src: "{{ ai_ops_deploy_root }}"
ai_ops_compose_files:
  - "{{ ai_ops_deploy_root }}/compose.yaml"
  - "{{ ai_ops_deploy_root }}/compose.override.yaml"
ai_ops_compose_env_files:
  - "{{ ai_ops_deploy_root }}/.env"

# Capacity gate thresholds for component deploys (no tuning of the host itself).
# The 200 MB default reflects a small 2 GB host; raise it per host when larger.
ai_ops_min_mem_mb: 200
ai_ops_min_disk_mb: 1024

# Controller Compose renderer for the drift gate's offline candidate render. It must
# equal the host's Compose version; preflight stops otherwise. Bump the version and
# both checksums (from the release checksums.txt) together.
ai_ops_compose_renderer_version: "2.40.3"
ai_ops_compose_renderer_sha256:
  x86_64: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
  aarch64: d26373b19e89160546d15407516cc59f453030d9bc5b43ba7faf16f7b4980137
ai_ops_compose_renderer_base_url: https://github.com/docker/compose/releases/download
ai_ops_compose_renderer_dir: "/var/tmp/ai-gateway-ops/compose-{{ ai_ops_compose_renderer_version }}"

# Create the remote .ai-ops-state directory in preflight (configuration and recovery
# operations). Component transactions and lock recovery manage it themselves.
ai_ops_state_dir_required: true
