---
- name: Verify exact candidate image presence or read-only pullability
  ansible.builtin.command:
    argv:
      - python3
      - '-c'
      - "{{ lookup('file', playbook_dir + '/../scripts/host/component-image.py', rstrip=false) }}"
      - "{{ _runtime }}"
      - "{{ _front_scope.image }}"
      - "{{ _front_image_mode }}"
      - "{{ 'true' if not ai_ops_profiles[service].get('pull', true) else 'false' }}"
  register: _front_image_raw
  changed_when: false
  no_log: true

- name: Parse candidate image proof
  ansible.builtin.set_fact:
    _front_image: "{{ _front_image_raw.stdout | from_json }}"
  no_log: true
