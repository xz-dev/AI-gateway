---
- name: Require the supported Docker recovery runtime
  ansible.builtin.assert:
    that: _runtime == 'docker'
    fail_msg: "Recovery uses Docker ownership labels and host network-namespace probes."

- name: Show bounded recovery deployment
  ansible.builtin.debug:
    msg: "Install a 30-second host timer; application probes only, 120-second grace, three failures, 10-minute cooldown, at most three restarts/hour/application. No database or netns restarts."

- name: Compare recovery deployment files without writing
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - path: "{{ ai_ops_deploy_root }}/ops/scripts/host/gateway_health.py"
      checksum: "{{ lookup('file', playbook_dir + '/../scripts/host/gateway_health.py', rstrip=false) | hash('sha256') }}"
    - path: "{{ ai_ops_deploy_root }}/ops/scripts/host/gateway-recovery.py"
      checksum: "{{ lookup('file', playbook_dir + '/../scripts/host/gateway-recovery.py', rstrip=false) | hash('sha256') }}"
    - path: /etc/systemd/system/ai-gateway-recovery.service
      checksum: "{{ ((lookup('file', playbook_dir + '/../scripts/host/ai-gateway-recovery.service') | replace('/root/AI-gateway', ai_ops_deploy_root)) + '\n') | hash('sha256') }}"
    - path: /etc/systemd/system/ai-gateway-recovery.timer
      checksum: "{{ ((lookup('file', playbook_dir + '/../scripts/host/ai-gateway-recovery.timer') | replace('/root/AI-gateway', ai_ops_deploy_root)) + '\n') | hash('sha256') }}"
  loop_control:
    label: "{{ item.path }}"
  register: _recovery_plan_files
  when: ai_ops_mode == 'plan'

- name: Show read-only recovery file plan
  ansible.builtin.debug:
    msg:
      path: "{{ item.item.path }}"
      changed: "{{ item.stat.checksum | default('missing') != item.item.checksum }}"
      current_sha256: "{{ item.stat.checksum | default('missing') }}"
      candidate_sha256: "{{ item.item.checksum }}"
  loop: "{{ _recovery_plan_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: ai_ops_mode == 'plan'

- name: Install bounded recovery guard
  when: ai_ops_mode == 'apply'
  block:
    - name: Ensure recovery script directory exists
      ansible.builtin.file:
        path: "{{ ai_ops_deploy_root }}/ops/scripts/host"
        state: directory
        mode: '0755'

    - name: Copy recovery guard and read-only role probes
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/host/{{ item }}"
        dest: "{{ ai_ops_deploy_root }}/ops/scripts/host/{{ item }}"
        mode: '0644'
        backup: true
      loop: [gateway_health.py, gateway-recovery.py]

    - name: Verify local application probes without restarts
      ansible.builtin.command:
        argv: [python3, "{{ ai_ops_deploy_root }}/ops/scripts/host/gateway-recovery.py"]
      register: _recovery_observation
      changed_when: false
      failed_when: >-
        _recovery_observation.rc != 0 or
        ((_recovery_observation.stdout | from_json).checks | selectattr('action', 'equalto', 'observe') | map(attribute='ok') | reject('equalto', true) | list | length > 0)

    - name: Install recovery service and timer
      ansible.builtin.copy:
        content: "{{ lookup('file', playbook_dir + '/../scripts/host/' + item) | replace('/root/AI-gateway', ai_ops_deploy_root) }}\n"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
        backup: true
      loop: [ai-gateway-recovery.service, ai-gateway-recovery.timer]

    - name: Validate recovery units
      ansible.builtin.command: systemd-analyze verify /etc/systemd/system/ai-gateway-recovery.service /etc/systemd/system/ai-gateway-recovery.timer
      changed_when: false

    - name: Enable bounded recovery timer
      ansible.builtin.systemd_service:
        name: ai-gateway-recovery.timer
        daemon_reload: true
        enabled: true
        state: started
