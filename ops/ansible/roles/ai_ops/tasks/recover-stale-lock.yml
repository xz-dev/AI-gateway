---
- name: Require isolated stale-lock recovery and explicit mode
  ansible.builtin.assert:
    that:
      - ai_ops_mode in ['plan', 'apply']
      - ansible_run_tags | difference(['always', 'recover-stale-lock']) | length == 0
      - ai_ops_lock_min_age_seconds | int >= 900
    fail_msg: Stale-lock recovery is separate from deploy; it never activates or restores anything.

- name: Read lock owner without modifying lock or state
  ansible.builtin.command:
    argv: [python3, '-c', "{{ lookup('file', playbook_dir + '/../scripts/host/component-lock.py', rstrip=false) }}", info, "{{ ai_ops_deploy_root }}"]
    stdin: '{}'
  register: _lock_recovery_raw
  changed_when: false

- name: Parse recovery owner
  ansible.builtin.set_fact:
    _lock_recovery: "{{ _lock_recovery_raw.stdout | from_json }}"

- name: Show exact lock owner for manual review
  ansible.builtin.debug:
    var: _lock_recovery

- name: Recover only the named transaction after controller and remote liveness checks
  when: ai_ops_mode == 'apply'
  block:
    - name: Require exact owner transaction; legacy or unknown locks stay locked
      ansible.builtin.assert:
        that:
          - _lock_recovery.held
          - _lock_recovery.owner is mapping
          - ai_ops_lock_transaction | length > 0
          - _lock_recovery.owner.transaction == ai_ops_lock_transaction
        fail_msg: Review the lock owner and progress receipt, then supply ai_ops_lock_transaction.

    - name: Check original controller is dead and no other local writer is alive
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file', playbook_dir + '/../scripts/host/component-lock.py', rstrip=false) }}", controller-check, "{{ ai_ops_deploy_root }}"]
        stdin: "{{ _lock_recovery.owner | to_json }}"
      delegate_to: localhost
      register: _lock_controller_raw
      changed_when: false

    - name: Release stale owned lock only after checking its receipt, age and remote writers
      ansible.builtin.command:
        argv: [python3, '-c', "{{ lookup('file', playbook_dir + '/../scripts/host/component-lock.py', rstrip=false) }}", recover, "{{ ai_ops_deploy_root }}"]
        stdin: "{{ {'transaction': ai_ops_lock_transaction, 'min_age_seconds': ai_ops_lock_min_age_seconds | int, 'controller_clear': (_lock_controller_raw.stdout | from_json).controller_clear} | to_json }}"
