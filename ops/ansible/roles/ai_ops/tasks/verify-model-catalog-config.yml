---
# Verify one freshly recreated model-catalog container after a config deploy/rollback.
# Inputs: _ai_verify_expected_policy_digest (sha256 of expected config.yaml bytes),
#         _ai_verify_expected_image_identity,
#         ai_verify_old_container (pre-activation container ID; new one must differ),
#         ai_protected_containers (map service -> captured container ID, must be unchanged).

- name: Read model-catalog container ID
  ansible.builtin.command: "{{ _compose }} ps -q model-catalog"
  register: _me_container
  changed_when: false
  failed_when: _me_container.rc != 0 or _me_container.stdout | trim == ""

- name: Require a fresh model-catalog container
  ansible.builtin.assert:
    that:
      - _me_container.stdout | trim != ai_verify_old_container
    fail_msg: >-
      model-catalog was not recreated
      (container={{ _me_container.stdout | trim }} still matches pre-activation ID {{ ai_verify_old_container }}).

- name: Read model-catalog image identity
  ansible.builtin.command: >-
    {{ _runtime }} inspect --format={{ '{{' }}.Image{{ '}}' }}
    {{ _me_container.stdout | trim }}
  register: _me_image
  changed_when: false

- name: Require expected model-catalog image identity
  ansible.builtin.assert:
    that:
      - _me_image.stdout | trim == _ai_verify_expected_image_identity
    fail_msg: >-
      model-catalog image changed during the operation
      (expected={{ _ai_verify_expected_image_identity }},
      observed={{ _me_image.stdout | trim }}).

- name: Validate mounted config inside the replacement container
  ansible.builtin.command: >-
    {{ _compose }} exec -T model-catalog
    /model-catalog validate-config /app/config.yaml
  register: _me_validate_raw
  changed_when: false
  no_log: true

- name: Parse in-container validation
  ansible.builtin.set_fact:
    _me_validate: "{{ _me_validate_raw.stdout | from_json }}"
  no_log: true

- name: Require mounted config to match expected bytes
  ansible.builtin.assert:
    that:
      - _me_validate.version | int == 1
      - _me_validate.config_digest == _ai_verify_expected_policy_digest
    fail_msg: >-
      model-catalog loaded unexpected config bytes
      (expected={{ _ai_verify_expected_policy_digest }},
      observed={{ _me_validate.config_digest | default('missing') }}).

- name: Re-check remote file checksum
  ansible.builtin.stat:
    path: "{{ ai_ops_deploy_root }}/services/routing/model-catalog/config.yaml"
    checksum_algorithm: sha256
  register: _me_remote_stat

- name: Require remote file unchanged after activation
  ansible.builtin.assert:
    that:
      - _me_remote_stat.stat.checksum == _ai_verify_expected_policy_digest
    fail_msg: >-
      remote services/routing/model-catalog/config.yaml changed after activation
      (expected={{ _ai_verify_expected_policy_digest }},
      observed={{ _me_remote_stat.stat.checksum }}).

- name: Wait for model-catalog readiness
  ansible.builtin.command: >-
    {{ _compose }} exec -T model-catalog
    /model-catalog healthcheck
  register: _me_ready
  changed_when: false
  retries: "{{ ai_ops_model_catalog_verify_retries }}"
  delay: "{{ ai_ops_model_catalog_verify_delay_seconds }}"
  until: _me_ready.rc == 0

- name: Verify protected adjacent containers unchanged
  ansible.builtin.command: "{{ _compose }} ps -q {{ item.key }}"
  register: _me_protected
  changed_when: false
  loop: "{{ ai_protected_containers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Require protected container identities unchanged
  ansible.builtin.assert:
    that:
      - item.stdout | trim == item.item.value
    fail_msg: >-
      protected container {{ item.item.key }} was recreated
      (expected={{ item.item.value }}, observed={{ item.stdout | trim }}).
  loop: "{{ _me_protected.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Preserve sanitized verification facts
  ansible.builtin.set_fact:
    ai_model_catalog_verified_container: "{{ _me_container.stdout | trim }}"
    ai_model_catalog_verified_image: "{{ _me_image.stdout | trim }}"
    ai_model_catalog_verified_policy_digest: "{{ _me_validate.config_digest }}"
    ai_model_catalog_ready_attempts: "{{ _me_ready.attempts | default(1) }}"
