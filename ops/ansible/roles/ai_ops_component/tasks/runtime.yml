---
# Shared by front and generic profiles; full inspect/environment never enters output.
- name: Read component readiness and protected container identities
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib, importlib.util, json, os, subprocess, sys, time
        runtime, project, service, root, owner_name, env_names = sys.argv[1:]
        def docker(*args):
            return subprocess.check_output([runtime, *args], stderr=subprocess.DEVNULL, timeout=15).decode()
        def readiness(c):
            state = c['State']
            if 'Health' in state:
                return 'docker_healthcheck', state['Health'].get('Status') == 'healthy', None
            sys.path.insert(0, root + '/ops/scripts/host')
            spec = importlib.util.spec_from_file_location('gateway_recovery', root + '/ops/scripts/host/gateway-recovery.py')
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            if service in module.OBSERVE_HTTP:
                host, port, path, expected = module.OBSERVE_HTTP[service]
                ok = state.get('Running') and state['Pid'] > 0 and module.namespace_probe(state['Pid'], {
                    'host': host, 'port': port, 'path': path, 'expected': expected}).get('ok') is True
                return 'recovery_probe', bool(ok), None
            if service == 'cpa-model-sync':
                progress = module.worker_health(c, time.time())
                alive = state.get('Running') and not state.get('Paused') and not state.get('Restarting') and progress.get('ok') is True
                return 'worker_progress', bool(alive), progress.get('ready')
            return 'missing', False, None
        try:
            ids = docker('ps', '-aq', '--filter', 'label=com.docker.compose.project=' + project).split()
            containers = json.loads(docker('inspect', *ids))
            indexed = {}
            for c in containers:
                name = (c['Config'].get('Labels') or {}).get('com.docker.compose.service')
                if name in (service, owner_name):
                    assert c['Name'] == '/' + project + '-' + name + '-1'
                    assert name not in indexed
                    indexed[name] = c
            target = indexed[service]
            owner = indexed[owner_name] if owner_name else target
            def identity(c):
                return {'id': c['Id'], 'image': c['Image'], 'started': c['State']['StartedAt'],
                        'running': c['State'].get('Running', False), 'paused': c['State'].get('Paused', False),
                        'restarting': c['State'].get('Restarting', False)}
            def netns(c):
                return os.stat('/proc/' + str(c['State']['Pid']) + '/ns/net').st_ino if c['State'].get('Running') and c['State']['Pid'] > 0 else None
            env = dict(e.split('=', 1) for e in target['Config'].get('Env') or [])
            state = target['State']
            source, ready, upstream_ready = readiness(target)
            print(json.dumps({
                'identity': {'target': identity(target), 'owner': identity(owner),
                    'protected': {c['Id']: identity(c) for c in containers if c['Id'] != target['Id']}},
                'target': {'image': target['Image'], 'image_ref': target['Config']['Image'],
                    'running': state.get('Running', False), 'paused': state.get('Paused', False),
                    'restarting': state.get('Restarting', False),
                    'health': state.get('Health', {}).get('Status', 'missing'),
                    'ready': ready, 'readiness_source': source, 'upstream_ready': upstream_ready,
                    'network_mode': target['HostConfig']['NetworkMode'], 'netns': netns(target),
                    'config_env_hash': hashlib.sha256(json.dumps({k: env.get(k) for k in json.loads(env_names)}, sort_keys=True).encode()).hexdigest(),
                    'env': {k: env[k] for k in ('PORT', 'LISTEN_ADDR', 'UPSTREAM_URL', 'IGNORE_CLIENT_STORE_FALSE') if k in env}},
                'owner': {'id': owner['Id'], 'running': owner['State'].get('Running', False), 'netns': netns(owner)}
            }))
        except (AssertionError, KeyError, OSError, ValueError, subprocess.SubprocessError, ImportError):
            sys.exit('component identity/readiness read failed; no mutation authorized')
      - "{{ ai_ops_runtime_cli }}"
      - "{{ ai_ops_compose_project }}"
      - "{{ ai_ops_component_name }}"
      - "{{ ai_ops_deploy_root }}"
      - >-
          {{ (__ai_ops_component_live_config.services[ai_ops_component_name].get('network_mode', '') | replace('service:', '')) if
          __ai_ops_component_live_config.services[ai_ops_component_name].get('network_mode', '').startswith('service:') else '' }}
      - "{{ __ai_ops_component_source_config.services[ai_ops_component_name].get('environment', {}).keys() | list | to_json }}"
  register: __ai_ops_component_runtime_raw
  no_log: true
  changed_when: false
  check_mode: false
  retries: "{{ ai_ops_component_verify_retries if __ai_ops_component_wait | default(false) else 1 }}"
  delay: "{{ ai_ops_component_verify_delay_seconds }}"
  until: >-
    __ai_ops_component_runtime_raw.rc == 0 and
    (not (__ai_ops_component_wait | default(false)) or
     ((__ai_ops_component_runtime_raw.stdout | from_json).target.running and
      (__ai_ops_component_runtime_raw.stdout | from_json).target.ready))

- name: Parse component identities
  ansible.builtin.set_fact:
    __ai_ops_component_runtime: "{{ __ai_ops_component_runtime_raw.stdout | from_json }}"
  no_log: true

- name: Report worker upstream readiness as information only
  ansible.builtin.debug:
    msg:
      upstream_ready: "{{ __ai_ops_component_runtime.target.upstream_ready }}"
  when: ai_ops_component_name == 'cpa-model-sync'
