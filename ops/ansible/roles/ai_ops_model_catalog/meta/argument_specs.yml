---
argument_specs:
  deploy:
    short_description: Validate, deploy and verify the model-catalog profile (config.yaml, catalog.lua).
    description:
      - catalog.lua is managed only when the private file exists (custom script); a custom
        catalog.lua combined with metadata.include_models fails before upload, also under --check.
      - Validates each changed candidate with the deployed binary, recreates only model-catalog
        once and verifies image, both mounted file digests, readiness and unchanged neighbours,
        restoring both files on failure.
    options: &ai_ops_model_catalog_options
      ai_ops_model_catalog_verify_retries:
        type: int
        description: Readiness attempts after the recreate.
      ai_ops_model_catalog_verify_delay_seconds:
        type: int
        description: Delay between readiness attempts.
  rollback:
    short_description: Restore the pre-deploy model-catalog profile and prove readiness.
    options: *ai_ops_model_catalog_options
  verify:
    short_description: Verify the running model-catalog against ai_ops_managed_file_verify_expected.
    options: *ai_ops_model_catalog_options
