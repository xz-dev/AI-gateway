---
argument_specs:
  deploy:
    short_description: Validate, deploy and verify the model-catalog configuration.
    description:
      - Validates the candidate with the deployed binary, recreates only model-catalog and
        verifies image, mounted config digest, readiness and unchanged neighbours, restoring
        the previous config on failure.
    options: &ai_ops_model_catalog_options
      ai_ops_model_catalog_verify_retries:
        type: int
        description: Readiness attempts after the recreate.
      ai_ops_model_catalog_verify_delay_seconds:
        type: int
        description: Delay between readiness attempts.
  rollback:
    short_description: Restore the pre-deploy model-catalog config and prove readiness.
    options: *ai_ops_model_catalog_options
  verify:
    short_description: Verify the running model-catalog against ai_ops_managed_file_verify_expected.
    options: *ai_ops_model_catalog_options
