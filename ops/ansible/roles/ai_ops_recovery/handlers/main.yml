---
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart recovery timer
  ansible.builtin.systemd_service:
    name: ai-gateway-recovery.timer
    state: restarted

- name: Restart OpenRC recovery service
  ansible.builtin.command:
    argv: [rc-service, ai-gateway-recovery, restart]
  changed_when: true
