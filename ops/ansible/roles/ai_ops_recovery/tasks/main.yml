---
- name: Require the supported Docker recovery runtime
  ansible.builtin.assert:
    that: ai_ops_runtime_cli == 'docker'
    fail_msg: "Recovery uses Docker ownership labels and host network-namespace probes."
  tags: [always]

- name: Gather the service manager and virtualization facts
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', service_mgr, virtual]
  when: ai_ops_recovery_init == 'auto' or (ai_ops_recovery_init == 'openrc' and ai_ops_recovery_lxc is not defined)
  tags: [always]

- name: Resolve the recovery init system
  ansible.builtin.set_fact:
    __ai_ops_recovery_init: >-
      {{ ansible_facts['service_mgr'] | default('unknown') if ai_ops_recovery_init == 'auto' else ai_ops_recovery_init }}
  tags: [always]

- name: Require a supported service manager
  ansible.builtin.assert:
    that: __ai_ops_recovery_init in ['systemd', 'openrc']
    fail_msg: "Recovery supports systemd and OpenRC hosts; detected {{ __ai_ops_recovery_init }}."
  tags: [always]

- name: Show bounded recovery deployment
  ansible.builtin.debug:
    msg: >-
      Install a 30-second host recovery cycle ({{ 'systemd timer' if __ai_ops_recovery_init == 'systemd'
      else 'OpenRC supervised loop' }}); application probes only, 120-second grace, three failures,
      10-minute cooldown, at most three restarts/hour/application. No database or netns restarts.
  tags: [always]

- name: Check OpenRC preconditions before writing files
  ansible.builtin.include_tasks: openrc_preflight.yml
  when: __ai_ops_recovery_init == 'openrc'
  tags: [always]

- name: Ensure recovery script directory exists
  ansible.builtin.file:
    path: "{{ ai_ops_deploy_root }}/ops/scripts/host"
    state: directory
    mode: '0755'
  tags: [upload]

- name: Copy recovery guard and read-only role probes
  ansible.builtin.copy:
    src: "{{ ai_ops_scripts_dir }}/host/{{ item }}"
    dest: "{{ ai_ops_deploy_root }}/ops/scripts/host/{{ item }}"
    mode: '0644'
    backup: true
  loop: [gateway_health.py, gateway-recovery.py]
  tags: [upload]

- name: Verify local application probes without restarts
  ansible.builtin.command:
    argv: [python3, "{{ ai_ops_deploy_root }}/ops/scripts/host/gateway-recovery.py"]
  register: __ai_ops_recovery_observation
  changed_when: false
  failed_when: >-
    __ai_ops_recovery_observation.rc != 0 or
    ((__ai_ops_recovery_observation.stdout | from_json).checks | selectattr('action', 'equalto', 'observe')
     | map(attribute='ok') | reject('equalto', true) | list | length > 0)
  when: not ansible_check_mode
  tags: [verify]

- name: Install the recovery guard for the host's service manager
  ansible.builtin.include_tasks: "{{ __ai_ops_recovery_init }}.yml"
  tags: [always]
