---
# Pinned Squid image used for the offline `squid -k parse` validation of the rendered policy.
ai_ops_squid_image: ai-gateway-squid:6.13-2-deb13u3-r1

# Only resynchronize data/egress-proxy/policy.json with the deployed tree (after a
# provenance check), without render, upload or activation.
ai_ops_squid_source_only: false

# Controller scratch directory of the render (not managed state).
ai_ops_squid_staging: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/ai-gateway-ops/squid-staging"

# Remote directory of the generated policy tree.
ai_ops_squid_remote_dir: "{{ ai_ops_deploy_root }}/data/egress-proxy/generated"
