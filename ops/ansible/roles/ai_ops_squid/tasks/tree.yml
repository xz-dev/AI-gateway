---
# Squid policy deploy via tarball + manifest drift gate.
# Why: per-file drift checks cost ~5 SSH round trips each; with 177 generated
# policy files that is ~900 connections (~1h) and trips sshd rate limits.
# The manifest checksum over ALL generated files preserves the same guarantee
# (any remote hand-edit mismatches the manifest) with ~2 round trips.

# Controller scratch (design D5): rebuilt on every run, never a change.
- name: Build tarball + manifest locally
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ ai_ops_squid_staging | quote }}
    tar czf /tmp/ai-ops-squid-policy.tar.gz --exclude='ca.*' .
    find . -type f ! -name 'ca.*' -print0 | sort -z | xargs -0 sha256sum > /tmp/ai-ops-squid-manifest.txt
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: false
  check_mode: false
  tags: [always]

- name: Read local manifest checksum
  ansible.builtin.stat:
    path: /tmp/ai-ops-squid-manifest.txt
    checksum_algorithm: sha256
  delegate_to: localhost
  register: __ai_ops_squid_manifest_local
  tags: [always]

- name: "Drift gate: verify remote tree matches last deployed manifest"
  ansible.builtin.shell: |
    set -eo pipefail
    if [ ! -f {{ (ai_ops_squid_remote_dir + '/.manifest.txt') | quote }} ]; then
      echo "no remote manifest (first deploy)"; exit 0
    fi
    cd {{ ai_ops_squid_remote_dir | quote }}
    if sha256sum -c .manifest.txt --quiet 2>/dev/null; then
      echo "remote tree matches manifest"
    else
      echo "REMOTE DRIFT DETECTED in {{ ai_ops_squid_remote_dir }}" >&2
      sha256sum -c .manifest.txt 2>/dev/null | grep -v ': OK$' >&2 || true
      exit 1
    fi
  args:
    executable: /bin/bash
  register: __ai_ops_squid_drift
  changed_when: false
  check_mode: false
  failed_when: __ai_ops_squid_drift.rc != 0
  tags: [always]

- name: Show drift check result
  ansible.builtin.debug:
    var: __ai_ops_squid_drift.stdout_lines
  tags: [always]

- name: Read the remote manifest checksum
  ansible.builtin.stat:
    path: "{{ ai_ops_squid_remote_dir }}/.manifest.txt"
    checksum_algorithm: sha256
  register: __ai_ops_squid_manifest_remote
  tags: [always]

- name: Compare local manifest against remote manifest
  ansible.builtin.set_fact:
    __ai_ops_squid_changed: "{{ __ai_ops_squid_manifest_remote.stat.checksum | default('none') != __ai_ops_squid_manifest_local.stat.checksum }}"
  tags: [always]

- name: No effective change for squid policy
  ansible.builtin.debug:
    msg: "squid policy: no effective change"
  when: not __ai_ops_squid_changed
  tags: [always]

- name: Upload and extract the policy tree
  when: __ai_ops_squid_changed
  tags: [upload]
  block:
    - name: Upload tarball + manifest
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/tmp/{{ item | basename }}"
        mode: "0600"
      loop:
        - /tmp/ai-ops-squid-policy.tar.gz
        - /tmp/ai-ops-squid-manifest.txt

    - name: Extract policy tree on remote
      ansible.builtin.shell: |
        set -e
        mkdir -p {{ ai_ops_squid_remote_dir | quote }}
        tar xzf /tmp/ai-ops-squid-policy.tar.gz -C {{ ai_ops_squid_remote_dir | quote }}
        cp /tmp/ai-ops-squid-manifest.txt {{ (ai_ops_squid_remote_dir + '/.manifest.txt') | quote }}
        rm -f /tmp/ai-ops-squid-policy.tar.gz /tmp/ai-ops-squid-manifest.txt
      changed_when: true
      when: not ansible_check_mode

- name: Activate squid policy
  when:
    - not ansible_check_mode
    - __ai_ops_squid_changed
  tags: [activate]
  block:
    - name: Restart egress-proxy
      community.docker.docker_compose_v2:
        services: [egress-proxy]
        state: restarted
  rescue:
    - name: Report activation failure (no per-file rollback for tree deploys)
      ansible.builtin.fail:
        msg: >-
          Squid activation failed after tarball extract. The remote tree and
          .manifest.txt are consistent with the new policy; investigate and
          either retry or redeploy the previous local policy.
