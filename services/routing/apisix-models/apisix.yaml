upstreams:
  - id: model-catalog
    type: roundrobin
    nodes:
      "model-catalog:8090": 1
    timeout:
      connect: 5
      send: 30
      read: 30
  - id: aisix
    type: roundrobin
    nodes:
      "aisix:3000": 1
    timeout:
      connect: 3600
      send: 3600
      read: 3600

# Constant pipe: no body is read here. AISIX resolves every model by priority
# (exact route or direct row, then a narrower glob, then its single * fallback row).
routes:
  # Liveness is local and never touches a dependency, so failures do not cascade.
  # The pinned APISIX 3.19 ships no termination plugin; fault-injection abort answers locally.
  - id: local-health
    uri: /healthz
    methods: [GET, HEAD]
    priority: 1000
    plugins:
      fault-injection:
        abort:
          http_status: 200
          body: '{"status":"ok"}'
  # Sub2API reads the Codex manifest and the plain list from its inference base URL.
  - id: codex-models
    uri: /v1/models
    methods: [GET]
    priority: 20
    upstream_id: model-catalog
  # The caller's AISIX credential passes through unchanged.
  - id: aisix
    uri: /*
    priority: 1
    enable_websocket: true
    plugins:
      proxy-buffering:
        disable_proxy_buffering: true
    upstream_id: aisix
#END
