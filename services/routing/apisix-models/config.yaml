apisix:
  # Bind only the inbound relay targets: healthcheck/self, Sub2API relay target, front-door catalog leg (front-catalog).
  node_listen:
    - ip: 127.0.0.1
      port: 9080
    - ip: 172.30.12.2
      port: 9080
    - ip: 172.30.45.3
      port: 9080
  enable_admin: false
  enable_control: false
  enable_ipv6: false
  # Internal plaintext pipe; do not open the default 9443 TLS listener.
  ssl:
    enable: false
  dns_resolver:
    - 127.0.0.11

nginx_config:
  worker_processes: 1
  error_log_level: warn
  http:
    # Keeper-expanded Responses history stays internal; the front door keeps 16 MiB for clients.
    client_max_body_size: 64m
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
